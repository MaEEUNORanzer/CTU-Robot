<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AGV系统状态分析</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a1d21;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* 左侧控制面板 */
        .control-panel {
            width: 280px;
            background: linear-gradient(180deg, #23272a 0%, #1a1d21 100%);
            padding: 1.5rem;
            border-right: 1px solid #40444b;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* 右侧主内容区 */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #2c2f33;
            position: relative;
            overflow-y: auto;
        }

        /* 顶部标题栏 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            background-color: #23272a;
            border-bottom: 1px solid #40444b;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #7289da;
            background: linear-gradient(135deg, #7289da, #5b6eae);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .title {
            font-size: 1.2rem;
            color: #ffffff;
            font-weight: 500;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #7289da, #5b6eae);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(114, 137, 218, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: #7289da;
            border: 1px solid #7289da;
        }

        .btn-secondary:hover {
            background: rgba(114, 137, 218, 0.1);
        }

        .btn-success {
            background: #43b581;
            color: white;
        }

        .btn-success:hover {
            background: #3ca374;
        }

        .btn-warning {
            background: #faa61a;
            color: white;
        }

        .btn-warning:hover {
            background: #e69516;
        }

        .btn-danger {
            background: #f04747;
            color: white;
        }

        .btn-danger:hover {
            background: #d63e3e;
        }

        /* 控制面板内容 */
        .control-section {
            margin-bottom: 1.5rem;
        }

        .control-section h3 {
            font-size: 1rem;
            color: #ffffff;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .control-section h3 i {
            color: #7289da;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            color: #8a8f98;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 0.8rem;
            background: #2c2f33;
            border: 1px solid #40444b;
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.9rem;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: #7289da;
        }

        /* 时间选择器 */
        .time-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
        }

        .time-option {
            background: #2c2f33;
            border: 1px solid #40444b;
            border-radius: 6px;
            padding: 0.6rem 0.3rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }

        .time-option:hover {
            background: #36393f;
            border-color: #7289da;
        }

        .time-option.active {
            background: rgba(114, 137, 218, 0.2);
            border-color: #7289da;
            color: #7289da;
        }

        .time-label {
            font-size: 0.8rem;
            color: #8a8f98;
        }

        /* 指标卡片 */
        .metric-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.8rem;
        }

        .metric-card {
            background: #2c2f33;
            border: 1px solid #40444b;
            border-radius: 8px;
            padding: 0.8rem;
            text-align: center;
            transition: all 0.3s;
        }

        .metric-card:hover {
            transform: translateY(-2px);
            border-color: #7289da;
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 0.3rem;
        }

        .metric-label {
            font-size: 0.8rem;
            color: #8a8f98;
        }

        /* 警报列表 */
        .alert-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .alert-item {
            background: rgba(240, 71, 71, 0.1);
            border: 1px solid rgba(240, 71, 71, 0.3);
            border-radius: 6px;
            padding: 0.6rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .alert-item.warning {
            background: rgba(250, 166, 26, 0.1);
            border-color: rgba(250, 166, 26, 0.3);
        }

        .alert-item.info {
            background: rgba(114, 137, 218, 0.1);
            border-color: rgba(114, 137, 218, 0.3);
        }

        .alert-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .alert-icon.error {
            background: rgba(240, 71, 71, 0.2);
            color: #f04747;
        }

        .alert-icon.warning {
            background: rgba(250, 166, 26, 0.2);
            color: #faa61a;
        }

        .alert-icon.info {
            background: rgba(114, 137, 218, 0.2);
            color: #7289da;
        }

        .alert-content {
            flex: 1;
        }

        .alert-title {
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .alert-time {
            color: #8a8f98;
            font-size: 0.7rem;
        }

        /* 主内容区域 */
        .dashboard-content {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
        }

        /* 仪表盘网格 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: auto;
            gap: 1.5rem;
        }

        /* 仪表盘部件 */
        .dashboard-widget {
            background: #23272a;
            border: 1px solid #40444b;
            border-radius: 12px;
            padding: 1.5rem;
            position: relative;
        }

        .widget-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .widget-title {
            font-size: 1.1rem;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .widget-title i {
            color: #7289da;
        }

        .widget-actions {
            display: flex;
            gap: 0.5rem;
        }

        .widget-action-btn {
            background: none;
            border: none;
            color: #8a8f98;
            cursor: pointer;
            padding: 0.2rem;
        }

        .widget-action-btn:hover {
            color: #7289da;
        }

        /* 尺寸定义 */
        .widget-small { grid-column: span 3; }
        .widget-medium { grid-column: span 4; }
        .widget-large { grid-column: span 6; }
        .widget-xlarge { grid-column: span 8; }
        .widget-full { grid-column: span 12; }

        /* 健康度指示器 */
        .health-indicator {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .health-gauge {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .health-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .health-score {
            font-size: 2rem;
            font-weight: bold;
            color: #ffffff;
        }

        .health-label {
            font-size: 0.8rem;
            color: #8a8f98;
        }

        .health-details {
            flex: 1;
        }

        .health-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.8rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #40444b;
        }

        .health-item:last-child {
            margin-bottom: 0;
            border-bottom: none;
        }

        .health-item-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #ffffff;
            font-size: 0.9rem;
        }

        .health-item-value {
            font-weight: bold;
        }

        /* 状态卡片 */
        .status-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }

        .status-card {
            background: #2c2f33;
            border: 1px solid #40444b;
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            transition: all 0.3s;
        }

        .status-card:hover {
            transform: translateY(-2px);
            border-color: #7289da;
        }

        .status-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 0.8rem;
            font-size: 1.2rem;
        }

        .status-icon.success { background: rgba(67, 181, 129, 0.2); color: #43b581; }
        .status-icon.warning { background: rgba(250, 166, 26, 0.2); color: #faa61a; }
        .status-icon.error { background: rgba(240, 71, 71, 0.2); color: #f04747; }
        .status-icon.info { background: rgba(114, 137, 218, 0.2); color: #7289da; }

        .status-count {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 0.3rem;
        }

        .status-label {
            font-size: 0.9rem;
            color: #8a8f98;
        }

        /* 图表容器 */
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }

        /* 性能指标 */
        .performance-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .performance-item {
            background: #2c2f33;
            border: 1px solid #40444b;
            border-radius: 8px;
            padding: 1rem;
        }

        .performance-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.8rem;
        }

        .performance-label {
            color: #8a8f98;
            font-size: 0.9rem;
        }

        .performance-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
        }

        .performance-change {
            font-size: 0.8rem;
            padding: 0.2rem 0.5rem;
            border-radius: 10px;
        }

        .performance-change.positive {
            background: rgba(67, 181, 129, 0.2);
            color: #43b581;
        }

        .performance-change.negative {
            background: rgba(240, 71, 71, 0.2);
            color: #f04747;
        }

        .performance-trend {
            height: 40px;
            margin-top: 0.5rem;
        }

        /* 热力图 */
        .heatmap-container {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem;
        }

        .heatmap-cell {
            aspect-ratio: 1;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .heatmap-cell:hover {
            transform: scale(1.1);
        }

        .heatmap-legend {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }

        .heatmap-legend-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.8rem;
            color: #8a8f98;
        }

        .heatmap-legend-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }

        /* 表格 */
        .table-container {
            overflow-x: auto;
        }

        .analysis-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .analysis-table th {
            background: #2c2f33;
            color: #ffffff;
            font-weight: 600;
            text-align: left;
            padding: 1rem;
            border-bottom: 1px solid #40444b;
        }

        .analysis-table td {
            padding: 1rem;
            border-bottom: 1px solid #40444b;
            color: #b9bbbe;
        }

        .analysis-table tr:hover {
            background: rgba(114, 137, 218, 0.05);
        }

        .status-badge {
            padding: 0.2rem 0.6rem;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .status-badge.online { background: rgba(67, 181, 129, 0.2); color: #43b581; }
        .status-badge.warning { background: rgba(250, 166, 26, 0.2); color: #faa61a; }
        .status-badge.offline { background: rgba(240, 71, 71, 0.2); color: #f04747; }
        .status-badge.idle { background: rgba(114, 137, 218, 0.2); color: #7289da; }

        /* 排行榜 */
        .leaderboard {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem;
            background: #2c2f33;
            border: 1px solid #40444b;
            border-radius: 6px;
        }

        .leaderboard-rank {
            width: 24px;
            height: 24px;
            background: #7289da;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .leaderboard-info {
            flex: 1;
            margin-left: 1rem;
        }

        .leaderboard-name {
            color: #ffffff;
            font-weight: 500;
        }

        .leaderboard-details {
            color: #8a8f98;
            font-size: 0.8rem;
        }

        .leaderboard-value {
            font-weight: bold;
            color: #ffffff;
        }

        /* 趋势指示器 */
        .trend-indicator {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .trend-up { color: #43b581; }
        .trend-down { color: #f04747; }
        .trend-flat { color: #8a8f98; }

        /* 底部状态栏 */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 1.5rem;
            background-color: #23272a;
            border-top: 1px solid #40444b;
        }

        .status-items {
            display: flex;
            gap: 1.5rem;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-label {
            color: #8a8f98;
            font-size: 0.9rem;
        }

        .status-value {
            color: #ffffff;
            font-weight: 500;
        }

        /* 加载动画 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 29, 33, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #40444b;
            border-top-color: #7289da;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        .loading-text {
            color: #ffffff;
            font-size: 1.1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #8a8f98;
        }

        .empty-state i {
            font-size: 2rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* 响应式调整 */
        @media (max-width: 1400px) {
            .widget-small { grid-column: span 6; }
            .widget-medium { grid-column: span 6; }
            .widget-large { grid-column: span 12; }
            .widget-xlarge { grid-column: span 12; }
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .control-panel { width: 100%; height: auto; border-right: none; border-bottom: 1px solid #40444b; }
            .content-area { height: calc(100vh - 300px); }
            .widget-small, .widget-medium, .widget-large, .widget-xlarge { grid-column: span 12; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧控制面板 -->
        <div class="control-panel">
            <!-- 时间范围选择 -->
            <div class="control-section">
                <h3><i class="fas fa-calendar-alt"></i> 时间范围</h3>
                <div class="time-selector">
                    <div class="time-option active" onclick="changeTimeRange('today')">
                        <div style="font-size: 1.2rem; font-weight: bold;">今日</div>
                        <div class="time-label">实时</div>
                    </div>
                    <div class="time-option" onclick="changeTimeRange('week')">
                        <div style="font-size: 1.2rem; font-weight: bold;">本周</div>
                        <div class="time-label">趋势</div>
                    </div>
                    <div class="time-option" onclick="changeTimeRange('month')">
                        <div style="font-size: 1.2rem; font-weight: bold;">本月</div>
                        <div class="time-label">统计</div>
                    </div>
                </div>
            </div>

            <!-- 关键指标 -->
            <div class="control-section">
                <h3><i class="fas fa-chart-line"></i> 关键指标</h3>
                <div class="metric-cards">
                    <div class="metric-card">
                        <div class="metric-value" id="totalTasks">0</div>
                        <div class="metric-label">总任务数</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value" id="successRate">0%</div>
                        <div class="metric-label">成功率</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value" id="avgResponse">0ms</div>
                        <div class="metric-label">平均响应</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value" id="agvUtilization">0%</div>
                        <div class="metric-label">AGV利用率</div>
                    </div>
                </div>
            </div>

            <!-- 系统警报 -->
            <div class="control-section">
                <h3><i class="fas fa-exclamation-triangle"></i> 系统警报</h3>
                <div class="alert-list" id="alertList">
                    <!-- 警报列表由JavaScript生成 -->
                </div>
            </div>

            <!-- 数据源选择 -->
            <div class="control-section">
                <h3><i class="fas fa-database"></i> 数据源</h3>
                <div class="form-group">
                    <select class="form-select" id="dataSource" onchange="changeDataSource()">
                        <option value="realtime">实时数据</option>
                        <option value="historical">历史数据</option>
                        <option value="simulation">模拟数据</option>
                        <option value="imported">导入数据</option>
                    </select>
                </div>
            </div>

            <!-- 刷新控制 -->
            <div class="control-section">
                <h3><i class="fas fa-sync-alt"></i> 刷新控制</h3>
                <div class="form-group">
                    <label class="form-label">自动刷新间隔</label>
                    <select class="form-select" id="refreshInterval" onchange="changeRefreshInterval()">
                        <option value="0">手动刷新</option>
                        <option value="5">5秒</option>
                        <option value="10" selected>10秒</option>
                        <option value="30">30秒</option>
                        <option value="60">1分钟</option>
                    </select>
                </div>
            </div>

            <!-- 导出控制 -->
            <div class="control-section" style="margin-top: auto;">
                <button class="btn btn-primary" onclick="exportDashboard()" style="width: 100%; margin-bottom: 0.5rem;">
                    <i class="fas fa-download"></i> 导出报告
                </button>
                <button class="btn btn-secondary" onclick="sendEmailReport()" style="width: 100%; margin-bottom: 0.5rem;">
                    <i class="fas fa-envelope"></i> 发送邮件
                </button>
                <button class="btn btn-warning" onclick="generateDailyReport()" style="width: 100%;">
                    <i class="fas fa-file-alt"></i> 生成日报
                </button>
            </div>
        </div>

        <!-- 右侧主内容区 -->
        <div class="content-area">
            <!-- 顶部标题栏 -->
            <div class="header">
                <div class="logo">AGV</div>
                <div class="title">系统整体状态分析仪表盘</div>
                <div class="header-actions">
                    <button class="btn btn-secondary" onclick="showHelp()">
                        <i class="fas fa-question-circle"></i> 帮助
                    </button>
                    <button class="btn btn-secondary" onclick="toggleFullscreen()">
                        <i class="fas fa-expand"></i> 全屏
                    </button>
                    <button class="btn btn-success" onclick="refreshData()">

        // ==================== 数据加载 ====================
        
        function loadData() {
            showLoading('正在加载系统数据...');
            
            // 模拟异步加载
            setTimeout(() => {
                // 这里应该是真实的API调用
                // 使用模拟数据
                systemData = JSON.parse(JSON.stringify(MOCK_DATA));
                
                // 添加一些动态变化
                updateDynamicData();
                
                // 更新所有图表
                updateAllCharts();
                
                // 更新UI
                updateUI();
                
                // 更新最后更新时间
                updateLastUpdateTime();
                
                hideLoading();
            }, 800);
        }
        
        function updateDynamicData() {
            if (!systemData) return;
            
            // 添加一些随机变化，模拟实时数据
            const now = new Date();
            const hour = now.getHours();
            
            // 更新任务数据
            systemData.tasks.total += Math.floor(Math.random() * 5);
            systemData.tasks.completed += Math.floor(Math.random() * 5);
            systemData.tasks.success_rate = Math.min(99.9, Math.max(90, 
                systemData.tasks.success_rate + (Math.random() - 0.5) * 0.2
            ));
            
            // 更新AGV状态
            systemData.agvs.forEach(agv => {
                // 电池消耗
                if (agv.status === 'running') {
                    agv.battery = Math.max(5, agv.battery - Math.random() * 2);
                } else if (agv.status === 'charging') {
                    agv.battery = Math.min(100, agv.battery + Math.random() * 8);
                }
                
                // 状态变化
                if (agv.battery < 20 && agv.status !== 'charging') {
                    agv.status = 'warning';
                } else if (agv.battery > 90 && agv.status === 'charging') {
                    agv.status = 'idle';
                }
                
                // 效率变化
                agv.efficiency = Math.min(99.9, Math.max(80, 
                    agv.efficiency + (Math.random() - 0.5) * 0.3
                ));
            });
            
            // 更新系统指标
            systemData.system.health_score = Math.min(100, Math.max(60, 
                systemData.system.health_score + (Math.random() - 0.5) * 0.5
            ));
            
            systemData.system.cpu_usage = Math.min(100, Math.max(20, 
                systemData.system.cpu_usage + (Math.random() - 0.5) * 3
            ));
            
            systemData.system.agv_utilization = Math.min(100, Math.max(40, 
                systemData.system.agv_utilization + (Math.random() - 0.5) * 2
            ));
            
            // 根据时间生成任务趋势
            const hourIndex = hour;
            if (hourIndex < 24) {
                systemData.tasks.daily_trend[hourIndex] = 
                    Math.floor(30 + Math.sin(hourIndex / 24 * Math.PI) * 40 + Math.random() * 20);
            }
        }

            chart.data.datasets[0].data = trend.slice(0, 12);
            chart.data.datasets[1].data = successRates.slice(0, 12);
            
            chart.update('none');

            chart.update('none');

        function drawHealthGauge(score, color) {
            const canvas = document.getElementById('healthGaugeCanvas');
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 50;
            
            // 清除画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制背景圆弧
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, Math.PI * 0.8, Math.PI * 2.2);
            ctx.strokeStyle = '#40444b';
            ctx.lineWidth = 8;
            ctx.stroke();
            
            // 绘制进度圆弧
            const endAngle = Math.PI * 0.8 + (Math.PI * 1.4) * (score / 100);
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, Math.PI * 0.8, endAngle);
            ctx.strokeStyle = color;
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.stroke();
            
            // 添加动画效果
            canvas.style.transform = 'scale(1.05)';
            setTimeout(() => {
                canvas.style.transform = 'scale(1)';
            }, 300);
        }

        function drawMiniCharts() {
            // 绘制小型趋势图
            const miniCharts = [
                { id: 'successRateChart', data: [95.2, 94.8, 95.6, 95.8, 96.1, 95.7, 95.9], color: COLOR_SCHEME.success },
                { id: 'responseTimeChart', data: [135, 132, 128, 126, 124, 126, 128], color: COLOR_SCHEME.primary },
                { id: 'todayTasksChart', data: [142, 156, 148, 161, 155, 168, 172], color: COLOR_SCHEME.warning },
                { id: 'systemLoadChart', data: [3.5, 3.2, 3.4, 3.1, 3.3, 3.2, 3.2], color: COLOR_SCHEME.info }
            ];
            
            miniCharts.forEach(chartConfig => {
                const canvas = document.getElementById(chartConfig.id);
                if (!canvas) return;
                
                const ctx = canvas.getContext('2d');
                const width = canvas.width = canvas.clientWidth;
                const height = canvas.height = canvas.clientHeight;
                
                // 清除画布
                ctx.clearRect(0, 0, width, height);
                
                // 计算数据范围
                const data = chartConfig.data;
                const minValue = Math.min(...data);
                const maxValue = Math.max(...data);
                const range = maxValue - minValue;
                
                // 绘制网格线
                ctx.strokeStyle = '#40444b';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, height * 0.5);
                ctx.lineTo(width, height * 0.5);
                ctx.stroke();
                
                // 绘制趋势线
                ctx.beginPath();
                ctx.strokeStyle = chartConfig.color;
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                data.forEach((value, index) => {
                    const x = (index / (data.length - 1)) * width;
                    const y = height - ((value - minValue) / range) * height;
                    
                    if (index === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                });
                
                ctx.stroke();
            });
        }

                            COLOR_SCHEME.success,

                            COLOR_SCHEME.warning,

                        borderWidth: 2,
                        borderColor: '#23272a'
                    }]

                options: {
                    responsive: true,
                    maintainAspectRatio: false,

                        legend: {
                            position: 'right',

                            backgroundColor: 'rgba(0, 0, 0, 0.8)',

                        }

        function toggleTaskChartType() {
            if (!charts.taskPerformance) return;
            
            const currentType = charts.taskPerformance.config.type;
            const newType = currentType === 'line' ? 'bar' : 'line';
            
            charts.taskPerformance.config.type = newType;
            charts.taskPerformance.update();
        }
        
        function toggleResourceChart() {
            if (!charts.resourceUtilization) return;
            
            const currentType = charts.resourceUtilization.config.type;
            const newType = currentType === 'doughnut' ? 'bar' : 'doughnut';
            
            charts.resourceUtilization.config.type = newType;
            charts.resourceUtilization.update();
        }
        
        function toggleHeatmapView() {
            const heatmapContainer = document.getElementById('heatmapContainer');
            const currentView = heatmapContainer.dataset.view || 'grid';
            
            if (currentView === 'grid') {
                // 切换到折线图视图
                heatmapContainer.innerHTML = `
                    <div class="chart-container" style="height: 200px;">
                        <canvas id="heatmapLineChart"></canvas>
                    </div>
                `;
                drawHeatmapLineChart();
                heatmapContainer.dataset.view = 'line';
            } else {
                // 切换回网格视图
                updateHeatmap();
                heatmapContainer.dataset.view = 'grid';
            }
        }
        
        function drawHeatmapLineChart() {
            const canvas = document.getElementById('heatmapLineChart');
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            const days = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
            const faultData = days.map(() => Math.floor(Math.random() * 10));
            
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: days,
                    datasets: [{
                        label: '故障次数',
                        data: faultData,
                        borderColor: COLOR_SCHEME.danger,
                        backgroundColor: COLOR_SCHEME.danger + '20',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            grid: { color: '#40444b' },
                            ticks: { color: '#8a8f98' }
                        },
                        y: {
                            grid: { color: '#40444b' },
                            ticks: { color: '#8a8f98' },
                            beginAtZero: true
                        }
                    },
                    plugins: {
                        legend: {
                            labels: { color: '#ffffff' }
                        }
                    }
                }
            });
        }
        
        function changeLeaderboardMetric() {
            const agvLeaderboard = document.getElementById('agvLeaderboard');
            const currentMetric = agvLeaderboard.dataset.metric || 'tasks';
            
            const metrics = {
                tasks: { key: 'tasks_completed', label: '完成任务数' },
                efficiency: { key: 'efficiency', label: '效率' },
                battery: { key: 'battery', label: '电池电量' },
                uptime: { key: 'uptime', label: '运行时间' }
            };
            
            const metricKeys = Object.keys(metrics);
            const currentIndex = metricKeys.indexOf(currentMetric);
            const nextIndex = (currentIndex + 1) % metricKeys.length;
            const nextMetric = metrics[metricKeys[nextIndex]];
            
            // 排序AGV
            const agvs = [...systemData.agvs];
            agvs.sort((a, b) => b[nextMetric.key] - a[nextMetric.key]);
            
            agvLeaderboard.innerHTML = agvs.map((agv, index) => `
                <div class="leaderboard-item">
                    <div class="leaderboard-rank">${index + 1}</div>
                    <div class="leaderboard-info">
                        <div class="leaderboard-name">${agv.id} - ${agv.name}</div>
                        <div class="leaderboard-details">状态: ${getStatusText(agv.status)}</div>
                    </div>
                    <div class="leaderboard-value">${agv[nextMetric.key]}${nextMetric.key === 'efficiency' ? '%' : ''}</div>
                </div>
            `).join('');
            
            agvLeaderboard.dataset.metric = metricKeys[nextIndex];
            
            // 更新标题
            const titleElement = document.querySelector('.widget-title');
            if (titleElement) {
                titleElement.innerHTML = `<i class="fas fa-trophy"></i> AGV${nextMetric.label}排名`;
            }
        }
        
        function toggleKPIView() {
            const performanceMetrics = document.getElementById('performanceMetrics');
            const currentView = performanceMetrics.dataset.view || 'grid';
            
            if (currentView === 'grid') {
                // 切换到图表视图
                performanceMetrics.innerHTML = `
                    <div class="chart-container" style="height: 200px;">
                        <canvas id="kpiCombinedChart"></canvas>

            new Chart(ctx, {

                            fill: true,

                            label: '成功率',

                    ]
                },

                            ticks: { color: '#8a8f98' }
                        },
                        y: {
                            type: 'linear',

                            position: 'left',
                            grid: { color: '#40444b' },
                            ticks: { color: '#8a8f98' }

        function downloadTaskData() {
            const data = {
                labels: charts.taskPerformance.data.labels,
                datasets: charts.taskPerformance.data.datasets
            };
            
            const dataStr = JSON.stringify(data, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            
            const link = document.createElement('a');
            link.href = dataUri;
            link.download = 'task-performance-data.json';
            link.click();
            
            alert('任务数据已下载');
        }
        
        function exportTableData() {
            const table = document.getElementById('analysisTable');
            const rows = table.querySelectorAll('tr');
            let csvContent = '';
            
            rows.forEach(row => {
                const cols = row.querySelectorAll('th, td');
                const rowData = Array.from(cols).map(col => {
                    let text = col.textContent.trim();
                    // 处理包含逗号的内容
                    if (text.includes(',')) {
                        text = `"${text}"`;
                    }
                    return text;
                });
                csvContent += rowData.join(',') + '\n';
            });
            
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'agv-analysis-data.csv';
            link.click();
            
            URL.revokeObjectURL(url);
            
            alert('表格数据已导出为CSV文件');
        }
        
        function filterTable() {
            const filter = prompt('请输入筛选条件（AGV编号、状态等）:', '');
            if (filter) {
                const table = document.getElementById('analysisTable');
                const rows = table.querySelectorAll('tbody tr');
                
                rows.forEach(row => {
                    const text = row.textContent.toLowerCase();
                    row.style.display = text.includes(filter.toLowerCase()) ? '' : 'none';
                });
                
                alert(`已筛选包含"${filter}"的行`);
            }
        }
        
        function sortTable() {
            const column = prompt('请输入要排序的列号（1-8）:', '4');
            if (column >= 1 && column <= 8) {
                const table = document.getElementById('analysisTable');
                const tbody = table.querySelector('tbody');
                const rows = Array.from(tbody.querySelectorAll('tr:not(:last-child)'));
                
                rows.sort((a, b) => {
                    const aVal = a.cells[column - 1].textContent;
                    const bVal = b.cells[column - 1].textContent;
                    
                    // 尝试转换为数字比较
                    const aNum = parseFloat(aVal);
                    const bNum = parseFloat(bVal);
                    
                    if (!isNaN(aNum) && !isNaN(bNum)) {
                        return bNum - aNum; // 降序排列
                    }
                    
                    return bVal.localeCompare(aVal);
                });
                
                // 重新排列行
                rows.forEach(row => tbody.appendChild(row));
                
                alert(`已按第${column}列排序`);
            }
        }

        }
        
        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') {
                return;
            }
            
            switch(e.key.toLowerCase()) {
                case 'r':
                    if (e.ctrlKey) {
                        e.preventDefault();
                        refreshData();
                    }
                    break;
                case 'f':
                    if (e.ctrlKey) {
                        e.preventDefault();
                        toggleFullscreen();
                    }
                    break;
                case 'h':
                    if (e.ctrlKey) {
                        e.preventDefault();
                        showHelp();
                    }
                    break;
                case 's':
                    if (e.ctrlKey) {
                        e.preventDefault();
                        exportDashboard();
                    }
                    break;
                case 'escape':
                    if (document.fullscreenElement) {
                        toggleFullscreen();
                    }
                    break;
            }
        });
        
        // 页面卸载前清理
        window.addEventListener('beforeunload', () => {
            clearInterval(refreshTimer);
        });
