<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AGV仓储场景可视化</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a1d21;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* 左侧控制面板 - 调整为280px */
        .control-panel {
            width: 280px; /* 从320px调整为280px */
            background: linear-gradient(180deg, #23272a 0%, #1a1d21 100%);
            padding: 1.2rem; /* 减少内边距 */
            border-right: 1px solid #40444b;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* 右侧3D场景 */
        .scene-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #2c2f33;
            position: relative;
        }

        /* 顶部标题栏 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            background-color: #23272a;
            border-bottom: 1px solid #40444b;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #7289da;
            background: linear-gradient(135deg, #7289da, #5b6eae);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .title {
            font-size: 1.1rem; /* 稍微减小字体 */
            color: #ffffff;
            font-weight: 500;
        }

        .header-actions {
            display: flex;
            gap: 0.8rem; /* 减少间距 */
        }

        .btn {
            padding: 0.4rem 0.8rem; /* 减小按钮大小 */
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.4rem; /* 减少图标文字间距 */
            transition: all 0.3s;
            font-size: 0.9rem; /* 减小字体 */
        }

        .btn-primary {
            background: linear-gradient(135deg, #7289da, #5b6eae);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(114, 137, 218, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: #7289da;
            border: 1px solid #7289da;
        }

        .btn-secondary:hover {
            background: rgba(114, 137, 218, 0.1);
        }

        .btn-success {
            background: #43b581;
            color: white;
        }

        .btn-success:hover {
            background: #3ca374;
        }

        .btn-warning {
            background: #7289da;
            color: white;
        }

        .btn-warning:hover {
            background: #e69516;
        }

        .btn-danger {
            background: #7289da;
            color: white;
        }

        .btn-danger:hover {
            background: #e69516;
        }

        /* 控制面板内容 */
        .control-section {
            margin-bottom: 1.2rem; /* 减少间距 */
        }

        .control-section h3 {
            font-size: 0.95rem; /* 减小字体 */
            color: #ffffff;
            margin-bottom: 0.8rem; /* 减少间距 */
            display: flex;
            align-items: center;
            gap: 0.4rem; /* 减少间距 */
        }

        .control-section h3 i {
            color: #7289da;
        }

        .form-group {
            margin-bottom: 0.8rem; /* 减少间距 */
        }

        .form-label {
            display: block;
            color: #8a8f98;
            margin-bottom: 0.4rem; /* 减少间距 */
            font-size: 0.85rem; /* 减小字体 */
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 0.6rem; /* 减小内边距 */
            background: #2c2f33;
            border: 1px solid #40444b;
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.85rem; /* 减小字体 */
        }

        .form-textarea {
            resize: vertical;
            min-height: 50px; /* 减小最小高度 */
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: #7289da;
        }

        /* 场景控制 - 调整为2列 */
        .scene-controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 改为2列 */
            gap: 0.4rem; /* 减少间距 */
            margin-bottom: 0.8rem;
        }

        .control-btn {
            background: #2c2f33;
            border: 1px solid #40444b;
            border-radius: 6px;
            padding: 0.6rem; /* 减小内边距 */
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem; /* 减少间距 */
        }

        .control-btn:hover {
            background: #36393f;
            border-color: #7289da;
        }

        .control-btn i {
            font-size: 1rem; /* 减小图标大小 */
            color: #7289da;
        }

        .control-btn span {
            font-size: 0.75rem; /* 减小字体 */
        }

        /* 场景元素管理 */
        .scene-elements {
            max-height: 250px; /* 减小最大高度 */
            overflow-y: auto;
        }

        .element-item {
            background: #2c2f33;
            border: 1px solid #40444b;
            border-radius: 6px;
            padding: 0.6rem; /* 减小内边距 */
            margin-bottom: 0.4rem; /* 减少间距 */
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.3s;
        }

        .element-item:hover {
            background: #36393f;
            border-color: #7289da;
        }

        .element-item.selected {
            background: rgba(114, 137, 218, 0.1);
            border-color: #7289da;
        }

        .element-info {
            display: flex;
            align-items: center;
            gap: 0.6rem; /* 减少间距 */
        }

        .element-icon {
            width: 28px; /* 减小尺寸 */
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem; /* 减小图标 */
        }

        .element-icon.agv { background: rgba(114, 137, 218, 0.2); color: #7289da; }
        .element-icon.shelf { background: rgba(67, 181, 129, 0.2); color: #43b581; }
        .element-icon.charging { background: rgba(250, 166, 26, 0.2); color: #faa61a; }
        .element-icon.obstacle { background: rgba(240, 71, 71, 0.2); color: #f04747; }
        .element-icon.zone { background: rgba(89, 54, 149, 0.2); color: #593695; }
        .element-icon.workstation { background: rgba(155, 89, 182, 0.2); color: #9b59b6; }
        .element-icon.path { background: rgba(52, 152, 219, 0.2); color: #3498db; }

        .element-details h4 {
            color: #ffffff;
            font-size: 0.85rem; /* 减小字体 */
            margin-bottom: 0.1rem;
        }

        .element-details p {
            color: #8a8f98;
            font-size: 0.75rem; /* 减小字体 */
        }

        .element-actions {
            display: flex;
            gap: 0.2rem; /* 减少间距 */
        }

        .element-action-btn {
            background: none;
            border: none;
            color: #8a8f98;
            cursor: pointer;
            padding: 0.2rem;
            font-size: 0.8rem; /* 减小图标 */
        }

        .element-action-btn:hover {
            color: #7289da;
        }

        /* 属性面板 */
        .property-group {
            margin-bottom: 0.8rem; /* 减少间距 */
        }

        .property-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.4rem; /* 减少间距 */
        }

        .property-label {
            color: #8a8f98;
            font-size: 0.85rem; /* 减小字体 */
        }

        .property-value {
            color: #ffffff;
            font-weight: 500;
            font-size: 0.85rem; /* 减小字体 */
        }

        /* 3D场景容器 */
        .scene-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #sceneCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 3D控制面板 */
        .scene-3d-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 0.4rem; /* 减少间距 */
            z-index: 10;
        }

        .view-btn {
            width: 36px; /* 减小尺寸 */
            height: 36px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #40444b;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .view-btn:hover {
            background: rgba(114, 137, 218, 0.7);
            border-color: #7289da;
        }

        .view-btn.active {
            background: #7289da;
            border-color: #7289da;
        }

        /* 信息面板 */
        .info-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #40444b;
            border-radius: 8px;
            padding: 0.8rem; /* 减小内边距 */
            width: 280px; /* 减小宽度 */
            z-index: 10;
        }

        .info-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.6rem; /* 减少间距 */
        }

        .info-header h4 {
            color: #7289da;
            margin: 0;
            font-size: 0.95rem; /* 减小字体 */
        }

        .close-info {
            background: none;
            border: none;
            color: #8a8f98;
            cursor: pointer;
        }

        .info-content {
            font-size: 0.85rem; /* 减小字体 */
        }

        .info-item {
            margin-bottom: 0.4rem; /* 减少间距 */
        }

        .info-label {
            color: #8a8f98;
            display: inline-block;
            width: 90px; /* 减小宽度 */
            font-size: 0.85rem;
        }

        .info-value {
            color: #ffffff;
            font-size: 0.85rem;
        }

        /* 网格坐标 */
        .grid-coordinates {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #8a8f98;
            font-size: 0.75rem; /* 减小字体 */
            background: rgba(0, 0, 0, 0.5);
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
        }

        /* 选择模式 */
        .selection-mode {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: #8a8f98;
            font-size: 0.8rem; /* 减小字体 */
            background: rgba(0, 0, 0, 0.5);
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
        }

        /* 底部状态栏 */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 1.2rem; /* 减小内边距 */
            background-color: #23272a;
            border-top: 1px solid #40444b;
        }

        .status-items {
            display: flex;
            gap: 1.2rem; /* 减少间距 */
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 0.4rem; /* 减少间距 */
        }

        .status-label {
            color: #8a8f98;
            font-size: 0.85rem; /* 减小字体 */
        }

        .status-value {
            color: #ffffff;
            font-weight: 500;
            font-size: 0.85rem; /* 减小字体 */
        }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #2c2f33;
            padding: 1.5rem; /* 减小内边距 */
            border-radius: 12px;
            width: 450px; /* 减小宽度 */
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.2rem; /* 减少间距 */
        }

        .modal-header h3 {
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.4rem; /* 减少间距 */
            font-size: 1.1rem; /* 减小字体 */
        }

        .close-modal {
            background: none;
            border: none;
            color: #8a8f98;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .modal-actions {
            display: flex;
            gap: 0.8rem; /* 减少间距 */
            margin-top: 1.2rem; /* 减少间距 */
        }

        /* 颜色选择器 */
        .color-picker {
            display: flex;
            gap: 0.4rem; /* 减少间距 */
            flex-wrap: wrap;
        }

        .color-option {
            width: 22px; /* 减小尺寸 */
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .color-option:hover {
            transform: scale(1.1);
        }

        .color-option.selected {
            border-color: #ffffff;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        /* 滑块组 */
        .slider-group {
            margin-bottom: 0.8rem; /* 减少间距 */
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.4rem; /* 减少间距 */
        }

        .slider-label span {
            color: #8a8f98;
            font-size: 0.85rem; /* 减小字体 */
        }

        .slider-value {
            color: #ffffff;
            font-weight: 500;
            min-width: 36px; /* 减小宽度 */
            text-align: right;
            font-size: 0.85rem; /* 减小字体 */
        }

        input[type="range"] {
            width: 100%;
            height: 5px; /* 减小高度 */
            -webkit-appearance: none;
            background: #40444b;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px; /* 减小尺寸 */
            height: 16px;
            border-radius: 50%;
            background: #7289da;
            cursor: pointer;
        }

        /* 开关按钮 */
        .switch {
            position: relative;
            display: inline-block;
            width: 45px; /* 减小宽度 */
            height: 22px; /* 减小高度 */
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #40444b;
            transition: .4s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #7289da;
        }

        input:checked + .slider:before {
            transform: translateX(23px);
        }

        /* 网格线 */
        .grid-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .grid-line {
            stroke: rgba(255, 255, 255, 0.1);
            stroke-width: 1;
        }

        /* 加载动画 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 29, 33, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #40444b;
            border-top-color: #7289da;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        .loading-text {
            color: #ffffff;
            font-size: 1rem; /* 减小字体 */
        }

        .loading-progress {
            width: 180px; /* 减小宽度 */
            height: 4px;
            background: #40444b;
            border-radius: 2px;
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .loading-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #7289da, #5b6eae);
            width: 0%;
            transition: width 0.3s ease;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 2rem 1.5rem; /* 减小内边距 */
            color: #8a8f98;
        }

        .empty-state i {
            font-size: 2.5rem; /* 减小图标 */
            margin-bottom: 0.8rem; /* 减少间距 */
            opacity: 0.5;
        }
        
        /* 路径控制按钮组 */
        .path-controls {
            display: flex;
            gap: 0.4rem; /* 减少间距 */
            margin-top: 0.4rem; /* 减少间距 */
        }
        
        .path-control-btn {
            flex: 1;
            padding: 0.4rem; /* 减小内边距 */
            background: #2c2f33;
            border: 1px solid #40444b;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem; /* 减少间距 */
            font-size: 0.75rem; /* 减小字体 */
        }
        
        .path-control-btn:hover {
            background: #36393f;
            border-color: #3498db;
        }
        
        .path-control-btn.active {
            background: #3498db;
            border-color: #3498db;
        }
        
        /* 路径动画 */
        .moving-point {
            position: absolute;
            width: 12px; /* 减小尺寸 */
            height: 12px;
            background: #ff3366;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff3366;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1000;
        }
        
        /* 工具提示 */
        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 4px 8px; /* 减小内边距 */
            border-radius: 4px;
            font-size: 11px; /* 减小字体 */
            pointer-events: none;
            z-index: 1000;
            white-space: nowrap;
        }
        
        /* 统计面板 */
        .stats-panel {
            position: absolute;
            top: 60px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #40444b;
            border-radius: 8px;
            padding: 0.8rem; /* 减小内边距 */
            width: 240px; /* 减小宽度 */
            z-index: 10;
        }
        
        .stats-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.6rem; /* 减少间距 */
        }
        
        .stats-header h4 {
            color: #7289da;
            margin: 0;
            font-size: 0.95rem; /* 减小字体 */
        }
        
        .stats-content {
            font-size: 0.85rem; /* 减小字体 */
        }
        
        .stats-item {
            margin-bottom: 0.4rem; /* 减少间距 */
            display: flex;
            justify-content: space-between;
        }
        
        .stats-label {
            color: #8a8f98;
            font-size: 0.85rem; /* 减小字体 */
        }
        
        .stats-value {
            color: #ffffff;
            font-weight: 500;
            font-size: 0.85rem; /* 减小字体 */
        }
        
        .stats-progress {
            height: 4px;
            background: #40444b;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 2px;
        }
        
        .stats-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #43b581, #2ecc71);
            transition: width 0.3s ease;
        }
        
        /* 路径列表 */
        .path-list {
            max-height: 180px; /* 减小高度 */
            overflow-y: auto;
            margin-top: 0.4rem; /* 减少间距 */
        }
        
        .path-list-item {
            padding: 0.4rem; /* 减小内边距 */
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            margin-bottom: 0.3rem; /* 减少间距 */
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .path-list-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .path-list-item.active {
            background: rgba(52, 152, 219, 0.2);
            border-left: 3px solid #3498db;
        }
        
        .path-name {
            font-size: 0.85rem; /* 减小字体 */
            font-weight: 500;
        }
        
        .path-info {
            font-size: 0.75rem; /* 减小字体 */
            color: #8a8f98;
            margin-top: 0.2rem; /* 减少间距 */
        }
        
        /* 路径动画指示器 */
        .path-animation-indicator {
            position: absolute;
            top: 120px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #40444b;
            border-radius: 8px;
            padding: 0.6rem; /* 减小内边距 */
            width: 160px; /* 减小宽度 */
            z-index: 10;
        }
        
        .animation-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ff3366;
            border-radius: 50%;
            margin-right: 5px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }
        

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: #2c2f33;
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #40444b;
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #7289da;
        }

        /* 新增样式：实时数据面板 */
        .real-time-panel {
            position: absolute;
            top: 360px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #40444b;
            border-radius: 8px;
            padding: 0.8rem;
            width: 320px;
            z-index: 10;
            max-height: 400px;
            overflow-y: auto;
        }

        .real-time-panel .info-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.6rem;
        }

        .real-time-panel .info-content {
            font-size: 0.85rem;
        }

        /* 全局状态面板 */
        .global-stats-panel {
            position: absolute;
            top: 360px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #40444b;
            border-radius: 8px;
            padding: 0.8rem;
            width: 320px;
            z-index: 10;
        }

        .global-stats-panel .stats-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.8rem;
        }

        .global-stats-panel .stats-header h4 {
            color: #7289da;
            margin: 0;
            font-size: 0.95rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.6rem;
            margin-bottom: 0.8rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            padding: 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            transition: all 0.3s;
        }

        .stat-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .stat-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .stat-info {
            flex: 1;
        }

        .stat-value {
            color: #ffffff;
            font-weight: 600;
            font-size: 1.2rem;
            line-height: 1.2;
        }

        .stat-label {
            color: #8a8f98;
            font-size: 0.75rem;
            margin-top: 0.1rem;
        }

        .stats-details {
            border-top: 1px solid #40444b;
            padding-top: 0.8rem;
            font-size: 0.85rem;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.4rem;
            padding: 0.3rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .detail-label {
            color: #8a8f98;
        }

        .detail-value {
            color: #ffffff;
            font-weight: 500;
        }

        /* 数据列表样式 */
        .data-list {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 0.4rem;
        }

        .data-item {
            padding: 0.4rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            margin-bottom: 0.3rem;
            font-size: 0.8rem;
        }

        .data-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.2rem;
        }

        .data-name {
            font-weight: 500;
            color: #ffffff;
        }

        .data-status {
            font-size: 0.75rem;
            padding: 0.1rem 0.3rem;
            border-radius: 3px;
        }

        .status-idle { background: rgba(114, 137, 218, 0.2); color: #7289da; }
        .status-moving { background: rgba(67, 181, 129, 0.2); color: #43b581; }
        .status-charging { background: rgba(250, 166, 26, 0.2); color: #faa61a; }
        .status-error { background: rgba(240, 71, 71, 0.2); color: #f04747; }

        .data-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.2rem;
            font-size: 0.75rem;
            color: #8a8f98;
        }

        /* 连接状态指示器 */
        .connection-status {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.85rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            margin-bottom: 0.4rem;
        }

        .status-connected { background: rgba(67, 181, 129, 0.2); color: #43b581; }
        .status-connecting { background: rgba(250, 166, 26, 0.2); color: #faa61a; }
        .status-disconnected { background: rgba(240, 71, 71, 0.2); color: #f04747; }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.connected { background: #43b581; animation: pulse 2s infinite; }
        .status-dot.connecting { background: #faa61a; animation: pulse 1s infinite; }
        .status-dot.disconnected { background: #f04747; }

        /* 紧凑模式 */
        .global-stats-panel.compact .stats-grid {
            grid-template-columns: repeat(4, 1fr);
        }

        .global-stats-panel.compact .stats-details {
            display: none;
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .global-stats-panel {
                position: relative;
                width: calc(100% - 20px);
                margin: 10px;
            }
            
            .real-time-panel {
                position: relative;
                width: calc(100% - 20px);
                margin: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧控制面板 -->
        <div class="control-panel" id="controlPanel">
            <!-- 折叠按钮 -->
            <div class="collapse-btn" onclick="toggleControlPanel()" id="collapseBtn">
                <i class="fas fa-chevron-left" id="collapseIcon"></i>
            </div>

            <!-- 场景控制 -->
            <div class="control-section">
                <h3><i class="fas fa-cube"></i> <span>场景控制</span></h3>
                <div class="scene-controls">
                    <button class="control-btn" onclick="changeView('top')" title="顶视图">
                        <i class="fas fa-eye"></i>
                        <span>顶视</span>
                    </button>
                    <button class="control-btn" onclick="changeView('front')" title="前视图">
                        <i class="fas fa-eye"></i>
                        <span>前视</span>
                    </button>
                    <button class="control-btn" onclick="changeView('side')" title="侧视图">
                        <i class="fas fa-eye"></i>
                        <span>侧视</span>
                    </button>
                    <button class="control-btn" onclick="zoomIn()" title="放大">
                        <i class="fas fa-search-plus"></i>
                        <span>放大</span>
                    </button>
                    <button class="control-btn" onclick="zoomOut()" title="缩小">
                        <i class="fas fa-search-minus"></i>
                        <span>缩小</span>
                    </button>
                    <button class="control-btn" onclick="resetView()" title="重置视图">
                        <i class="fas fa-sync-alt"></i>
                        <span>重置</span>
                    </button>
                    <button class="control-btn" onclick="toggleGrid()" id="gridToggleBtn" title="切换网格">
                        <i class="fas fa-th"></i>
                        <span>网格</span>
                    </button>
                    <button class="control-btn" onclick="togglePaths()" id="pathsToggleBtn" title="切换路径">
                        <i class="fas fa-route"></i>
                        <span>路径</span>
                    </button>
                    <button class="control-btn" onclick="toggleLabels()" id="labelsToggleBtn" title="切换标签">
                        <i class="fas fa-tag"></i>
                        <span>标签</span>
                    </button>
                    <button class="control-btn" onclick="toggleRealTimeMonitoring()" id="realTimeToggleBtn" title="实时数据">
                        <i class="fas fa-satellite-dish"></i>
                        <span>实时</span>
                    </button>
                </div>
                
                <!-- 路径仿真控制 -->
                <div class="path-controls">
                    <button class="path-control-btn" onclick="importPathFile()" title="导入路径">
                        <i class="fas fa-file-import"></i> <span>导入</span>
                    </button>
                    <button class="path-control-btn" onclick="startAllPaths()" title="开始仿真">
                        <i class="fas fa-play"></i> <span>开始</span>
                    </button>
                    <button class="path-control-btn" onclick="stopAllPaths()" title="停止仿真">
                        <i class="fas fa-stop"></i> <span>停止</span>
                    </button>
                </div>
                
                <!-- 路径动画控制 -->
                <div class="path-controls" style="margin-top: 0.4rem;">
                    <button class="path-control-btn" onclick="togglePathAnimation()" id="pathAnimationBtn" title="动画">
                        <i class="fas fa-wave-square"></i> <span>动画</span>
                    </button>
                    <button class="path-control-btn" onclick="showPathStats()" title="统计">
                        <i class="fas fa-chart-bar"></i> <span>统计</span>
                    </button>
                    <button class="path-control-btn" onclick="exportCurrentPaths()" title="导出">
                        <i class="fas fa-file-export"></i> <span>导出</span>
                    </button>
                </div>
            </div>

            <!-- 实时数据配置 -->
            <div class="control-section" id="realTimeConfigSection" style="display: none;">
                <h3><i class="fas fa-satellite-dish"></i> <span>实时数据配置</span></h3>
                
                <div class="form-group">
                    <label class="form-label">数据文件URL</label>
                    <input type="text" class="form-input" id="realtimeDataUrl" 
                           placeholder="http://localhost:3000/realtime_data.txt" 
                           value="realtime_data.txt">
                </div>
                
                <div class="slider-group">
                    <div class="slider-label">
                        <span>刷新频率</span>
                        <span class="slider-value" id="refreshRateValue">3</span>
                    </div>
                    <input type="range" id="refreshRate" min="50" max="1000" step="1" value="3" 
                           oninput="updateRefreshRate()">
                </div>
                
                <div class="form-group">
                    <label class="form-label">显示模式</label>
                    <select class="form-select" id="displayMode" onchange="updateDisplayMode()">
                        <option value="normal">正常</option>
                        <option value="compact">紧凑</option>
                        <option value="detailed">详细</option>
                    </select>
                </div>
                
                <div style="display: flex; gap: 0.4rem; margin-top: 0.4rem;">
                    <button class="btn btn-primary" onclick="testConnection()" style="flex: 1;">
                        <i class="fas fa-wifi"></i> <span>测试连接</span>
                    </button>
                    <button class="btn btn-secondary" onclick="forceRefresh()" style="flex: 1;">
                        <i class="fas fa-redo"></i> <span>强制刷新</span>
                    </button>
                </div>
            </div>

            <!-- 场景元素管理 -->
            <div class="control-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem;">
                    <h3><i class="fas fa-object-group"></i> <span>场景元素</span></h3>
                    <div style="display: flex; gap: 0.2rem;">
                        <button class="btn btn-success" onclick="showAddElementModal()" style="font-size: 0.8rem; padding: 0.2rem 0.4rem;" title="添加">
                            <i class="fas fa-plus"></i>
                        </button>
                        <button class="btn btn-danger" onclick="clearSelectedElement()" style="font-size: 0.8rem; padding: 0.2rem 0.4rem;" title="删除">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
                
                <div class="scene-elements" id="sceneElementsList">
                    <!-- 场景元素列表由JavaScript生成 -->
                </div>
            </div>

            <!-- 路径列表 -->
            <div class="control-section" id="pathListSection" style="display: none;">
                <h3><i class="fas fa-route"></i> <span>路径列表</span></h3>
                <div class="path-list" id="pathList">
                    <!-- 路径列表由JavaScript生成 -->
                </div>
            </div>

            <!-- 属性面板 -->
            <div class="control-section" id="propertiesPanel" style="display: none;">
                <h3><i class="fas fa-sliders-h"></i> <span>属性设置</span></h3>
                <div class="property-group" id="elementProperties">
                    <!-- 属性由JavaScript动态生成 -->
                </div>
            </div>

            <!-- 场景设置 -->
            <div class="control-section">
                <h3><i class="fas fa-cog"></i> <span>场景设置</span></h3>
                
                <div class="slider-group">
                    <div class="slider-label">
                        <span>光照</span>
                        <span class="slider-value" id="lightIntensityValue">0.8</span>
                    </div>
                    <input type="range" id="lightIntensity" min="0.1" max="2" step="0.1" value="0.8" oninput="updateLighting()">
                </div>
                
                <div class="slider-group">
                    <div class="slider-label">
                        <span>网格</span>
                        <span class="slider-value" id="gridSizeValue">10</span>
                    </div>
                    <input type="range" id="gridSize" min="5" max="20" step="1" value="10" oninput="updateGrid()">
                </div>
                
                <div class="form-group">
                    <label class="form-label">主题</label>
                    <select class="form-select" id="sceneTheme" onchange="changeSceneTheme()">
                        <option value="industrial">工业</option>
                        <option value="modern">现代</option>
                        <option value="dark">暗色</option>
                        <option value="light">明亮</option>
                    </select>
                </div>
                
                <!-- 路径显示设置 -->
                <div class="slider-group">
                    <div class="slider-label">
                        <span>路径粗</span>
                        <span class="slider-value" id="pathThicknessValue">0.8</span>
                    </div>
                    <input type="range" id="pathThickness" min="0.1" max="2" step="0.1" value="0.8" oninput="updatePathVisuals()">
                </div>
                
                <div class="slider-group">
                    <div class="slider-label">
                        <span>透明度</span>
                        <span class="slider-value" id="pathOpacityValue">0.7</span>
                    </div>
                    <input type="range" id="pathOpacity" min="0.1" max="1" step="0.1" value="0.7" oninput="updatePathVisuals()">
                </div>
                
                <div class="form-group">
                    <label class="form-label">曲线质量</label>
                    <select class="form-select" id="pathCurveQuality" onchange="updatePathVisuals()">
                        <option value="low">低</option>
                        <option value="medium" selected>中</option>
                        <option value="high">高</option>
                    </select>
                </div>
            </div>

            <!-- 动作按钮 -->
            <div class="control-section" style="margin-top: auto;">
                <button class="btn btn-primary" onclick="saveScene()" style="width: 100%; margin-bottom: 0.4rem;">
                    <i class="fas fa-save"></i> <span>保存</span>
                </button>
                <button class="btn btn-secondary" onclick="exportScene()" style="width: 100%; margin-bottom: 0.4rem;">
                    <i class="fas fa-download"></i> <span>导出</span>
                </button>
                <button class="btn btn-warning" onclick="toggleSimulation()" id="simulationBtn" style="width: 100%; margin-bottom: 0.4rem;">
                    <i class="fas fa-play"></i> <span>仿真</span>
                </button>
                <button class="btn btn-danger" onclick="resetScene()" style="width: 100%;">
                    <i class="fas fa-redo"></i> <span>重置</span>
                </button>
            </div>
        </div>

        <div class="scene-area">

            <div class="header">

                <!-- 3D控制面板 -->

                    </button>

                    <button class="view-btn" onclick="changeView('side')" title="侧视图">

                <!-- 统计面板 -->

                        <div class="info-item">
                            <span class="info-label">文件:</span>
                            <span class="info-value" id="realTimeFile">-</span>
                        </div>
                        <div id="realTimeDataContent">

                </div>
            </div>

            <!-- 底部状态栏 -->
            <div class="status-bar">
                <div class="status-items">
                    <div class="status-item">
                        <span class="status-label">场景:</span>
                        <span class="status-value" id="sceneName">默认场景</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">元素:</span>
                        <span class="status-value" id="elementCount">0</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">AGV:</span>
                        <span class="status-value" id="agvCount">0</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">路径:</span>
                        <span class="status-value" id="pathCount">0</span>
                    </div>
                </div>

    <!-- 文件输入（隐藏，用于导入路径文件） -->
    <input type="file" id="pathFileInput" accept=".json" style="display: none;" onchange="handlePathFileSelect(event)">

    <!-- Three.js库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls 控制器 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
    <!-- OBJ模型加载器 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <!-- MTL材质加载器 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>

    <script>
        // ==================== 全局变量 ====================
        const ELEMENT_TYPES = {
            'agv': { name: 'AGV机器人', icon: 'fa-robot', color: '#7289da' },
            'shelf': { name: '货架', icon: 'fa-boxes', color: '#43b581' },
            'charging': { name: '充电站', icon: 'fa-plug', color: '#faa61a' },
            'obstacle': { name: '障碍物', icon: 'fa-ban', color: '#f04747' },
            'workstation': { name: '工作站', icon: 'fa-desktop', color: '#593695' },
            'zone': { name: '区域', icon: 'fa-map-marker-alt', color: '#9b59b6' },
            'conveyor': { name: '传送带', icon: 'fa-conveyor-belt', color: '#3498db' },
            'path': { name: '路径', icon: 'fa-route', color: '#3498db' }
        };

        const AGV_COLORS = [
            '#7289da', '#43b581', '#faa61a', '#f04747', '#593695',
            '#9b59b6', '#1abc9c', '#e74c3c', '#3498db', '#2ecc71'
        ];

        // Three.js相关变量
        let scene, camera, renderer, controls, raycaster, mouse;
        let sceneElements = [];
        let selectedElement = null;
        let isSimulationRunning = false;
        let simulationStartTime = 0;
        let lastFrameTime = 0;
        let frameCount = 0;
        let fps = 60;
        
        // 场景设置
        let showGridLines = true;
        let showPaths = true;
        let showLabels = true;
        let currentView = 'perspective';
        let gridHelper = null;
        let groundMesh = null;
        
        // 路径系统
        let paths = [];  // 存储路径数据
        let activePaths = {};  // 正在运行的路径
        let pathVisuals = [];  // 路径可视化对象
        let isPathAnimationEnabled = true;  // 路径动画是否启用
        let pathAnimationTime = 0;  // 路径动画时间
        
        // 路径显示设置
        let pathSettings = {
            thickness: 0.8,
            opacity: 0.7,
            curveQuality: 'medium',
            showAnimation: true,
            showWaypoints: true,
            showLabels: true
        };
        
        // 场景尺寸
        const SCENE_WIDTH = 600;
        const SCENE_DEPTH = 600;
        const SCENE_HEIGHT = 20;
        
        // 模型缩放常量
        const MODEL_SCALES = {
            'agv': 20.0,         // AGV模型放大3倍
            'charging': 6.0,    // 充电桩模型放大3倍
            'shelf': 1.0,       // 货架模型保持原大小
            'obstacle': 1.0,    // 障碍物模型保持原大小
            'workstation': 1.0, // 工作站模型保持原大小
            'zone': 1.0,        // 区域模型保持原大小
            'conveyor': 1.0,    // 传送带模型保持原大小
            'path': 1.0,        // 路径模型保持原大小
            'default': 1.0      // 其他类型默认缩放
        };
        
        // 模型缓存
        let modelCache = {};
        let objLoader = new THREE.OBJLoader();
        let mtlLoader = new THREE.MTLLoader();
        
        // 统计信息
        let stats = {
            totalPaths: 0,
            activePaths: 0,
            completedPaths: 0,
            totalDistance: 0,
            averageSpeed: 0,
            simulationTime: 0
        };
        
        // 控制面板状态
        let isControlPanelCollapsed = false;
        
        // 实时数据监控系统
        let realTimeMonitoring = false;
        let refreshInterval = null;
        let refreshRate = 200;
        let displayMode = 'normal';
        let lastDataUpdate = null;
        let connectionStatus = 'disconnected';
        let realTimeData = {};
        
        // ==================== Three.js初始化 ====================
        
        function initThreeJS() {
            // 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1d21);
            
            // 创建相机
            camera = new THREE.PerspectiveCamera(
                60, // 视野角度
                window.innerWidth / window.innerHeight, // 宽高比
                0.1, // 近裁剪面
                1000 // 远裁剪面
            );
            camera.position.set(50, 80, 50);
            camera.lookAt(0, 0, 0);
            
            // 创建渲染器
            const canvas = document.getElementById('sceneCanvas');
            renderer = new THREE.WebGLRenderer({ 
                canvas: canvas,
                antialias: true,
                alpha: true
            });
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            
            // 创建控制器
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = false;
            controls.minDistance = 10;
            controls.maxDistance = 500;
            controls.maxPolarAngle = Math.PI;
            
            // 创建光线投射器
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            
            // 添加光源
            setupLighting();
            
            // 添加地面
            createGround();
            
            // 添加网格
            setupGrid();
            
            // 添加坐标轴
            const axesHelper = new THREE.AxesHelper(20);
            axesHelper.position.y = 0.1;
            scene.add(axesHelper);
            
            // 预加载模型
            preloadModels().then(() => {
                // 添加示例元素
                addExampleElements();
            }).catch(error => {
                console.error('预加载模型失败:', error);
                addExampleElements(); // 即使失败也继续
            });
            
            // 添加事件监听器
            setupEventListeners();
            
            // 开始动画循环
            animate();
        }
        
        // 预加载模型
        async function preloadModels() {
            showLoading('正在预加载OBJ模型...');
            
            const modelsToLoad = [
                { key: 'agv_standard', objPath: 'models/agv/agv_standard.obj', mtlPath: 'models/agv/agv_standard.mtl', type: 'agv' },
                { key: 'agv_heavy', objPath: 'models/agv/agv_heavy.obj', mtlPath: 'models/agv/agv_heavy.mtl', type: 'agv' },
                { key: 'agv_small', objPath: 'models/agv/small/agv_small.obj', mtlPath: 'models/agv/small/agv_small.mtl', type: 'agv' },
                { key: 'charging_station', objPath: 'models/charging/charging_station.obj', mtlPath: 'models/charging/charging_station.mtl', type: 'charging' }
            ];
            
            let loadedCount = 0;
            const total = modelsToLoad.length;
            
            for (const model of modelsToLoad) {
                try {
                    await loadOBJModelToCache(model.key, model.objPath, model.mtlPath, model.type);
                    loadedCount++;
                    
                    // 更新进度条
                    const progress = (loadedCount / total) * 100;
                    document.getElementById('loadingProgressBar').style.width = `${progress}%`;
                    
                } catch (error) {
                    console.warn(`预加载OBJ模型失败 ${model.key}:`, error);
                }
            }
            
            hideLoading();
        }
        
        // 加载OBJ模型到缓存
        function loadOBJModelToCache(key, objPath, mtlPath, type) {
            return new Promise((resolve, reject) => {
                if (modelCache[key]) {
                    resolve(modelCache[key]);
                    return;
                }
                
                const loadModel = (materials) => {
                    if (materials) {
                        objLoader.setMaterials(materials);
                    }
                    
                    objLoader.load(
                        objPath,
                        (object) => {
                            // 优化模型
                            optimizeModel(object, type);
                            
                            // 中心化模型
                            centerModel(object);
                            
                            // 计算边界框
                            const bbox = new THREE.Box3().setFromObject(object);
                            const height = bbox.max.y - bbox.min.y;
                            
                            // 保存模型高度信息
                            object.userData.modelHeight = height;
                            object.userData.originalScale = 1.0;
                            
                            // 启用阴影
                            enableShadows(object);
                            
                            // 缓存模型
                            modelCache[key] = object;
                            
                            console.log(`OBJ模型 ${key} 加载成功, 高度: ${height.toFixed(2)}`);
                            resolve(object);
                        },
                        (xhr) => {
                            // 显示加载进度
                            console.log(`${key} 加载进度: ${(xhr.loaded / xhr.total * 100).toFixed(1)}%`);
                        },
                        (error) => {
                            console.error(`加载OBJ模型失败 ${key}:`, error);
                            reject(error);
                        }
                    );
                };
                
                // 先尝试加载MTL材质
                if (mtlPath) {
                    mtlLoader.load(
                        mtlPath,
                        (materials) => {
                            materials.preload();
                            loadModel(materials);
                        },
                        undefined,
                        (error) => {
                            console.warn(`加载MTL材质失败 ${key}:`, error);
                            // 如果MTL加载失败，直接加载OBJ
                            loadModel(null);
                        }
                    );
                } else {
                    // 没有MTL文件，直接加载OBJ
                    loadModel(null);
                }
            });
        }
        
        // 中心化模型
        function centerModel(object) {
            const bbox = new THREE.Box3().setFromObject(object);
            const center = bbox.getCenter(new THREE.Vector3());
            const size = bbox.getSize(new THREE.Vector3());
            
            // 将模型移动到原点
            object.position.x = -center.x;
            object.position.y = -center.y;
            object.position.z = -center.z;
            
            // 保存尺寸信息
            object.userData.size = size;
            object.userData.originalCenter = center;
            
            return { center, size };
        }
        
        // 信标
        // 优化模型
        function optimizeModel(object, type) {
            object.traverse((child) => {
                if (child.isMesh) {
                    // 启用接收阴影
                    child.castShadow = true;
                    child.receiveShadow = true;
                    
                    // 如果材质不存在，创建默认材质
                    if (!child.material) {
                        child.material = createDefaultMaterial(type);
                    } else if (Array.isArray(child.material)) {
                        // 如果是材质数组，优化每个材质
                        child.material.forEach(mat => {
                            if (mat && !mat.transparent) {
                                mat.shininess = 30;
                                mat.specular = new THREE.Color(0x111111);
                                mat.needsUpdate = true;
                            }
                        });
                    } else if (child.material) {
                        // 优化单个材质
                        if (!child.material.transparent) {
                            child.material.shininess = 30;
                            child.material.specular = new THREE.Color(0x111111);
                            child.material.needsUpdate = true;
                        }
                    }
                }
            });
        }
        
        // 创建默认材质
        function createDefaultMaterial(type) {
            switch(type) {
                case 'agv':
                    return new THREE.MeshPhongMaterial({
                        color: 0x7289da,
                        shininess: 30,
                        specular: 0x111111
                    });
                case 'charging':
                    return new THREE.MeshPhongMaterial({
                        color: 0xfaa61a,
                        shininess: 20,
                        specular: 0x222222
                    });
                default:
                    return new THREE.MeshPhongMaterial({
                        color: 0x888888,
                        shininess: 20,
                        specular: 0x111111
                    });
            }
        }
        
        // 启用阴影
        function enableShadows(object) {
            object.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
        }
        
        // 创建地面
        function createGround() {
            // 移除旧的地面
            if (groundMesh) {
                scene.remove(groundMesh);
            }
            
            // 创建地面几何体
            const groundGeometry = new THREE.PlaneGeometry(SCENE_WIDTH, SCENE_DEPTH, 600, 600);
            
            // 创建地面材质
            const groundMaterial = new THREE.MeshPhongMaterial({
                color: 0x282828,
                side: THREE.DoubleSide,
                shininess: 10
            });
            
            // 创建地面网格
            groundMesh = new THREE.Mesh(groundGeometry, groundMaterial);
            groundMesh.rotation.x = -Math.PI / 2;
            groundMesh.position.y = 0;
            groundMesh.receiveShadow = true;
            
            // 添加地面纹理网格
            const gridGeometry = new THREE.PlaneGeometry(SCENE_WIDTH, SCENE_DEPTH, 1, 1);
            const gridMaterial = new THREE.MeshBasicMaterial({
                color: 0x40444b,
                wireframe: true,
                transparent: true,
                opacity: 0.3,
                side: THREE.DoubleSide
            });
            const groundGrid = new THREE.Mesh(gridGeometry, gridMaterial);
            groundGrid.rotation.x = -Math.PI / 2;
            groundGrid.position.y = 0.01;
            
            scene.add(groundMesh);
            scene.add(groundGrid);
        }
        
        function setupLighting() {
            // 环境光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            // 方向光
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(50, 100, 50);
            directionalLight.castShadow = true;
            directionalLight.shadow.camera.left = -50;
            directionalLight.shadow.camera.right = 50;
            directionalLight.shadow.camera.top = 50;
            directionalLight.shadow.camera.bottom = -50;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);
            
            // 辅助光
            const hemisphereLight = new THREE.HemisphereLight(0x444444, 0x080808, 0.4);
            scene.add(hemisphereLight);
        }
        
        function setupGrid() {
            // 移除旧的网格
            if (gridHelper) {
                scene.remove(gridHelper);
            }
            
            const gridSize = parseInt(document.getElementById('gridSize').value);
            gridHelper = new THREE.GridHelper(SCENE_WIDTH, gridSize, 0x40444b, 0x36393f);
            gridHelper.position.y = 0.02;
            scene.add(gridHelper);
            
            gridHelper.visible = showGridLines;
        }
        
        // ==================== 优美路径系统 ====================
        
        // 创建优美路径
        function createBeautifulPath(pathData) {
            if (!pathData.waypoints || pathData.waypoints.length < 2) return null;
            
            const group = new THREE.Group();
            const color = new THREE.Color(pathData.agvColor || '#3498db');
            
            // 转换坐标
            const points = [];
            pathData.waypoints.forEach(wp => {
                const sceneX = (wp.x - 500) / 10;
                const sceneZ = (wp.y - 100) / 10;
                points.push(new THREE.Vector3(sceneX, 0.5, sceneZ));
            });
            
            // 创建CatmullRom曲线
            const curve = new THREE.CatmullRomCurve3(points);
            curve.curveType = 'catmullrom';
            curve.tension = 0.5;
            
            // 根据质量设置分段数
            let segments = 50;
            switch(pathSettings.curveQuality) {
                case 'low': segments = 30; break;
                case 'high': segments = 100; break;
            }
            
            // 创建管道几何体
            const geometry = new THREE.TubeGeometry(
                curve,
                segments,
                pathSettings.thickness * 0.5,
                8,
                false
            );
            
            // 创建渐变材质
            const material = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 },
                    color: { value: color },
                    opacity: { value: pathSettings.opacity }
                },
                vertexShader: `
                    varying vec2 vUv;
                    varying vec3 vPosition;
                    varying float vDistance;
                    
                    void main() {
                        vUv = uv;
                        vPosition = position;
                        
                        // 计算距离用于渐变
                        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                        vDistance = length(worldPosition.xyz - cameraPosition);
                        
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float time;
                    uniform vec3 color;
                    uniform float opacity;
                    
                    varying vec2 vUv;
                    varying vec3 vPosition;
                    varying float vDistance;
                    
                    void main() {
                        // 基础颜色
                        vec3 baseColor = color;
                        
                        // 添加流动效果
                        float flow = sin(vUv.x * 10.0 - time * 2.0) * 0.5 + 0.5;
                        vec3 flowColor = mix(baseColor, baseColor * 1.5, flow * 0.3);
                        
                        // 添加边缘发光
                        float edge = smoothstep(0.4, 0.6, vUv.y);
                        vec3 finalColor = mix(flowColor, flowColor * 1.2, edge);
                        
                        // 添加距离渐变
                        float fog = 1.0 - smoothstep(0.0, 100.0, vDistance);
                        finalColor = mix(finalColor, vec3(0.5, 0.5, 0.5), 1.0 - fog);
                        
                        gl_FragColor = vec4(finalColor, opacity * fog);
                    }
                `,
                transparent: true,
                side: THREE.DoubleSide
            });
            
            const tube = new THREE.Mesh(geometry, material);
            group.add(tube);
            
            // 添加流动动画点
            if (pathSettings.showAnimation) {
                const sphereGeometry = new THREE.SphereGeometry(pathSettings.thickness * 0.3, 16, 16);
                const sphereMaterial = new THREE.MeshPhongMaterial({
                    color: 0xffffff,
                    emissive: 0xff3366,
                    emissiveIntensity: 1.0
                });
                
                const animationSphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
                animationSphere.userData.path = pathData;
                animationSphere.userData.progress = 0;
                animationSphere.userData.speed = 0.2;
                group.add(animationSphere);
            }
            
            // 添加路径点标记
            if (pathSettings.showWaypoints) {
                pathData.waypoints.forEach((wp, index) => {
                    const sceneX = (wp.x - 500) / 10;
                    const sceneZ = (wp.y - 100) / 10;
                    
                    // 确定点颜色
                    let pointColor = 0x3498db;
                    let pointSize = 0.8;
                    if (wp.type === 'start') {
                        pointColor = 0x2ecc71;  // 绿色
                        pointSize = 0.9;
                    } else if (wp.type === 'end') {
                        pointColor = 0xe74c3c;  // 红色
                        pointSize = 0.9;
                    } else if (wp.type === 'normal') {
                        pointColor = 0x3498db;  // 蓝色
                        pointSize = 0.5;
                    }
                    
                    // 创建发光球体
                    const sphereGeometry = new THREE.SphereGeometry(pointSize, 8, 8);
                    const sphereMaterial = new THREE.MeshPhongMaterial({ 
                        color: pointColor,
                        emissive: pointColor,
                        emissiveIntensity: 0.5,
                        transparent: true,
                        opacity: 0.9
                    });
                    
                    const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
                    sphere.position.set(sceneX, 0.5, sceneZ);
                    
                    // 添加脉冲动画
                    sphere.userData.originalScale = 1.0;
                    sphere.userData.pulseSpeed = 1.0 + Math.random() * 0.5;
                    sphere.userData.pulseOffset = Math.random() * Math.PI * 2;
                    
                    group.add(sphere);
                    
                    // 添加标签
                    if (pathSettings.showLabels) {
                        const labelGroup = new THREE.Group();
                        
                        // 创建编号标签
                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d');
                        canvas.width = 64;
                        canvas.height = 64;
                        
                        // 绘制圆形背景
                        context.beginPath();
                        context.arc(32, 32, 28, 0, Math.PI * 2);
                        context.fillStyle = 'rgba(0, 0, 0, 0.8)';
                        context.fill();
                        
                        // 绘制边框
                        context.beginPath();
                        context.arc(32, 32, 28, 0, Math.PI * 2);
                        context.strokeStyle = `rgb(${Math.floor(pointColor >> 16 & 255)}, ${Math.floor(pointColor >> 8 & 255)}, ${Math.floor(pointColor & 255)})`;
                        context.lineWidth = 2;
                        context.stroke();
                        
                        // 绘制编号
                        context.fillStyle = '#ffffff';
                        context.font = 'bold 20px Arial';
                        context.textAlign = 'center';
                        context.textBaseline = 'middle';
                        context.fillText((index + 1).toString(), 32, 32);
                        
                        const texture = new THREE.CanvasTexture(canvas);
                        const spriteMaterial = new THREE.SpriteMaterial({ 
                            map: texture,
                            transparent: true
                        });
                        const sprite = new THREE.Sprite(spriteMaterial);
                        sprite.position.y = 3;
                        sprite.scale.set(4, 4, 1);
                        labelGroup.add(sprite);
                        
                        // 添加连接线
                        const lineMaterial = new THREE.LineBasicMaterial({
                            color: pointColor,
                            transparent: true,
                            opacity: 0.5
                        });
                        
                        const lineGeometry = new THREE.BufferGeometry().setFromPoints([
                            new THREE.Vector3(0, 0.5, 0),
                            new THREE.Vector3(0, 2.5, 0)
                        ]);
                        
                        const line = new THREE.Line(lineGeometry, lineMaterial);
                        labelGroup.add(line);
                        
                        labelGroup.position.set(sceneX, 0, sceneZ);
                        group.add(labelGroup);
                    }
                });
            }
            
            return group;
        }

        // 显示路径统计
        function showPathStats() {
            const panel = document.getElementById('statsPanel');
            const content = document.getElementById('statsContent');
            
            if (panel.style.display === 'block') {
                panel.style.display = 'none';
                return;
            }
            
            // 计算统计数据
            stats.totalPaths = paths.length;
            stats.activePaths = Object.keys(activePaths).length;
            stats.completedPaths = stats.totalPaths - stats.activePaths;
            
            // 计算总距离
            stats.totalDistance = 0;
            paths.forEach(path => {
                if (path.waypoints && path.waypoints.length > 1) {
                    for (let i = 1; i < path.waypoints.length; i++) {
                        const wp1 = path.waypoints[i-1];
                        const wp2 = path.waypoints[i];
                        const distance = Math.sqrt(
                            Math.pow(wp2.x - wp1.x, 2) + 
                            Math.pow(wp2.y - wp1.y, 2)
                        );
                        stats.totalDistance += distance;
                    }
                }
            });
            stats.totalDistance = (stats.totalDistance / 1000).toFixed(1); // 转换为公里
            
            // 计算平均速度
            let totalSpeed = 0;
            let agvCount = 0;
            let movingAGVCount = 0;
            sceneElements.forEach(el => {
                if (el.type === 'agv' && el.properties.speed) {
                    totalSpeed += el.properties.speed;
                    agvCount++;
                    if (el.properties.status === 'moving') {
                        movingAGVCount++;
                    }
                }
            });
            stats.averageSpeed = agvCount > 0 ? (totalSpeed / agvCount).toFixed(1) : 0;
            stats.movingAGVs = movingAGVCount;
            
            // 计算仿真时间
            if (isSimulationRunning) {
                stats.simulationTime = (Date.now() - simulationStartTime) / 1000;
            }
            
            // 计算电池统计
            let totalBattery = 0;
            let lowBatteryCount = 0;
            sceneElements.forEach(el => {

                    totalBattery += el.properties.battery;
                    if (el.properties.battery < 20) {

            stats.averageBattery = agvCount > 0 ? (totalBattery / agvCount).toFixed(1) : 0;
            stats.lowBatteryCount = lowBatteryCount;

                    stats.pathCompletionTimes.push(completionTime);

        // 更新路径动画
        function updatePathAnimations(deltaTime) {
            if (!isPathAnimationEnabled) return;
            
            pathAnimationTime += deltaTime;
            
            // 更新所有路径的流动动画
            sceneElements.forEach(element => {
                if (element.type === 'path' && element.mesh) {
                    element.mesh.traverse((child) => {
                        if (child.isMesh && child.material && child.material.uniforms) {
                            // 更新着色器时间
                            if (child.material.uniforms.time) {
                                child.material.uniforms.time.value = pathAnimationTime;
                            }
                        }
                        
                        // 更新流动球体
                        if (child.userData && child.userData.path && child.userData.progress !== undefined) {
                            const pathData = child.userData.path;
                            if (pathData.waypoints && pathData.waypoints.length > 1) {
                                const points = [];
                                pathData.waypoints.forEach(wp => {
                                    const sceneX = (wp.x - 500) / 10;
                                    const sceneZ = (wp.y - 100) / 10;
                                    points.push(new THREE.Vector3(sceneX, 0.5, sceneZ));
                                });
                                
                                const curve = new THREE.CatmullRomCurve3(points);
                                curve.curveType = 'catmullrom';
                                curve.tension = 0.5;
                                
                                // 更新进度
                                child.userData.progress += child.userData.speed * deltaTime * 0.2;
                                if (child.userData.progress > 1) {
                                    child.userData.progress = 0;
                                }
                                
                                // 获取曲线上的位置
                                const point = curve.getPoint(child.userData.progress);
                                const tangent = curve.getTangent(child.userData.progress);
                                
                                child.position.copy(point);
                                child.position.y += Math.sin(pathAnimationTime * 2 + child.userData.progress * 10) * 0.2;
                                
                                // 使球体朝向移动方向
                                if (tangent.length() > 0) {
                                    child.lookAt(point.clone().add(tangent));
                                }
                            }
                        }
                        
                        // 更新路径点脉冲动画
                        if (child.userData && child.userData.originalScale !== undefined) {
                            const scale = child.userData.originalScale + 
                                         Math.sin(pathAnimationTime * child.userData.pulseSpeed + child.userData.pulseOffset) * 0.2;
                            child.scale.set(scale, scale, scale);
                        }
                    });
                }
            });
        }

        // 高亮显示指定路径
        function highlightPath(pathId) {
            // 首先取消所有高亮
            sceneElements.forEach(element => {
                if (element.type === 'path' && element.mesh) {
                    element.mesh.traverse((child) => {
                        if (child.isMesh && child.material && child.material.emissive) {
                            child.material.emissive.setHex(0x000000);
                        }
                    });
                }
            });
            
            // 高亮指定路径
            const pathElement = sceneElements.find(el => el.id === `path-${pathId}`);
            if (pathElement && pathElement.mesh) {
                pathElement.mesh.traverse((child) => {
                    if (child.isMesh && child.material && child.material.emissive) {
                        child.material.emissive.setHex(0x333333);
                    }
                });
                
                // 临时放大路径
                const originalScale = pathElement.mesh.scale.clone();
                pathElement.mesh.scale.multiplyScalar(1.1);
                
                // 3秒后恢复
                setTimeout(() => {
                    if (pathElement.mesh) {
                        pathElement.mesh.scale.copy(originalScale);
                    }
                }, 3000);
            }
        }

        // 初始化实时监控
        function initRealTimeMonitoring() {

                displayMode = config.displayMode || 'normal';
                document.getElementById('displayMode').value = displayMode;
