        // 开始实时监控
        function startRealTimeMonitoring() {
            stopRealTimeMonitoring(); // 先停止现有的
            
            refreshInterval = setInterval(() => {
                fetchRealTimeData();
            }, refreshRate);
            
            connectionStatus = 'connecting';
            updateConnectionStatus();
            
            // 立即获取一次数据
            fetchRealTimeData();
            
            console.log('开始实时监控，刷新频率:', refreshRate, 'ms');
        }

        // 停止实时监控
        function stopRealTimeMonitoring() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
            
            connectionStatus = 'disconnected';
            updateConnectionStatus();
            
            console.log('停止实时监控');
        }

        // 获取实时数据
        async function fetchRealTimeData() {
            const url = document.getElementById('realtimeDataUrl').value;
            
            if (!url) {
                console.error('实时数据URL未配置');
                return;
            }
            
            try {
                const response = await fetch(`${url}?t=${Date.now()}`, {
                    method: 'GET',
                    headers: {
                        'Cache-Control': 'no-cache',
                        'Pragma': 'no-cache'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP错误: ${response.status}`);
                }
                
                const textData = await response.text();
                processRealTimeData(textData);
                
                connectionStatus = 'connected';
                updateConnectionStatus();
                
            } catch (error) {
                console.error('获取实时数据失败:', error);
                connectionStatus = 'disconnected';
                updateConnectionStatus();
            }
        }

        // 处理实时数据
        function processRealTimeData(textData) {
            try {
                const lines = textData.trim().split('\n');
                const newData = {};
                
                lines.forEach(line => {
                    if (!line.trim() || line.startsWith('#')) return;
                    
                    const parts = line.split(',');
                    if (parts.length >= 4) {
                        const [id, x, y, status, ...extra] = parts.map(p => p.trim());
                        
                        const elementData = {
                            id: id,
                            x: parseFloat(x) || 0,
                            y: parseFloat(y) || 0,
                            status: status || 'idle',
                            timestamp: Date.now()
                        };
                        
                        // 解析额外参数
                        for (let i = 0; i < extra.length; i++) {
                            const param = extra[i].split('=');
                            if (param.length === 2) {
                                elementData[param[0]] = param[1];
                            }
                        }
                        
                        newData[id] = elementData;
                        
                        // 更新或创建场景元素
                        updateOrCreateElement(elementData);
                    }
                });
                
                realTimeData = newData;
                lastDataUpdate = Date.now();
                
                updateRealTimePanel();
                updateGlobalStats();
                
                console.log(`处理了${Object.keys(newData).length}个实时数据点`);
                
            } catch (error) {
                console.error('处理实时数据失败:', error);
            }
        }

        // 更新或创建场景元素
        function updateOrCreateElement(data) {
            const existingElement = sceneElements.find(el => el.id === data.id);
            
            if (existingElement) {
                // 更新现有元素
                existingElement.x = (data.x - 500) / 10;  // 坐标转换
                existingElement.z = (data.y - 100) / 10;  // 坐标转换
                
                // 更新状态
                existingElement.properties.status = data.status;
                existingElement.properties.speed = data.speed || 1.0;
                existingElement.properties.battery = data.battery || 100;
                
                // 更新颜色
                if (data.status === 'idle') {
                    existingElement.properties.color = '#7289da';
                } else if (data.status === 'moving') {
                    existingElement.properties.color = '#43b581';
                } else if (data.status === 'charging') {
                    existingElement.properties.color = '#faa61a';
                } else if (data.status === 'error') {
                    existingElement.properties.color = '#f04747';
                }
                
                existingElement.updatePosition();
                
                // 如果被选中，更新信息面板
                if (selectedElement && selectedElement.id === data.id) {
                    showInfoPanel(existingElement);
                }
                
            } else {
                // 创建新元素
                const color = getStatusColor(data.status);
                
                const element = new SceneElement(
                    data.id,
                    'agv',
                    data.id,  // 使用ID作为名称
                    (data.x - 500) / 10,  // 坐标转换
                    0,
                    (data.y - 100) / 10,  // 坐标转换
                    {
                        model: 'X1-2000',
                        speed: data.speed || 1.0,
                        battery: data.battery || 100,
                        status: data.status,
                        color: color,
                        realTime: true
                    }
                );
                
                sceneElements.push(element);
            }
            
            updateElementsList();
            updateStatus();
        }

        function getStatusColor(status) {
            switch(status) {
                case 'idle': return '#7289da';
                case 'moving': return '#43b581';
                case 'charging': return '#faa61a';
                case 'error': return '#f04747';

            fileElement.textContent = document.getElementById('realtimeDataUrl').value;

        // 工具函数：格式化时间差
        function formatTimeAgo(milliseconds) {
            const seconds = Math.floor(milliseconds / 1000);
            
            if (seconds < 60) {
                return `${seconds}秒`;
            } else if (seconds < 3600) {
                return `${Math.floor(seconds / 60)}分钟`;
            } else {
                return `${Math.floor(seconds / 3600)}小时`;
            }
        }

        // 工具函数：格式化时间
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
        }

                // updatePropertiesPanel();

            }

        function onMouseMove(event) {
            const canvas = document.getElementById('sceneCanvas');
            const rect = canvas.getBoundingClientRect();
            
            mouse.x = ((event.clientX - rect.left) / canvas.clientWidth) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / canvas.clientHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObjects(sceneElements.map(e => e.mesh));
            
            if (intersects.length > 0) {
                const element = sceneElements.find(e => e.mesh === intersects[0].object);
                if (element) {
                    canvas.style.cursor = 'pointer';
                    updateGridCoords(element.x, element.y, element.z);
                    return;
                } else {
                    sceneElements.forEach(el => {
                        if (el.mesh) {
                            el.mesh.traverse((child) => {
                                if (child === intersects[0].object) {
                                    canvas.style.cursor = 'pointer';
                                    updateGridCoords(el.x, el.y, el.z);
                                    return;
                                }
                            });
                        }
                    });
                }
            }
            
            canvas.style.cursor = 'default';
            
            const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            const intersectionPoint = new THREE.Vector3();
            if (raycaster.ray.intersectPlane(plane, intersectionPoint)) {
                updateGridCoords(intersectionPoint.x, 0, intersectionPoint.z);
            }
        }

        function onKeyDown(event) {
            if (!selectedElement) return;
            
            const moveAmount = 1;
            
            switch(event.key) {
                case 'ArrowUp':
                    selectedElement.z -= moveAmount;
                    break;
                case 'ArrowDown':
                    selectedElement.z += moveAmount;
                    break;
                case 'ArrowLeft':
                    selectedElement.x -= moveAmount;
                    break;
                case 'ArrowRight':
                    selectedElement.x += moveAmount;
                    break;
                case 'w':
                case 'W':
                    selectedElement.y += moveAmount;
                    break;
                case 's':
                case 'S':
                    selectedElement.y -= moveAmount;
                    break;
                default:
                    return;
            }
            
            selectedElement.updatePosition();
            updatePropertiesPanel();
            event.preventDefault();
        }

        // ==================== 场景元素类 ====================

        class SceneElement {
            constructor(id, type, name, x = 0, y = 0, z = 0, properties = {}) {
                this.id = id;
                this.type = type;
                this.name = name;
                this.x = x;
                this.y = y;
                this.z = z;
                this.properties = properties;
                this.mesh = null;
                this.label = null;
                this.path = null;
                
                this.createMeshAsync();
            }
            
            async createMeshAsync() {
                try {
                    const elementType = ELEMENT_TYPES[this.type];
                    
                    switch(this.type) {
                        case 'agv':
                            await this.createAGVModel();
                            break;
                        case 'charging':
                            await this.createChargingModel();
                            break;
                        case 'path':
                            this.createPathModel();
                            break;
                        default:
                            this.createBasicMesh(elementType);
                            break;
                    }
                    
                    this.setupElement();
                    
                } catch (error) {
                    console.error(`创建模型失败 ${this.name}:`, error);
                    this.createFallbackMesh();
                    this.setupElement();
                }
            }
            
            async createAGVModel() {
                let modelKey = 'agv_standard';
                switch(this.properties.model) {
                    case 'X2-3000': modelKey = 'agv_heavy'; break;
                    case 'S1-1000': modelKey = 'agv_small'; break;
                }
                
                if (!modelCache[modelKey]) {
                    try {
                        await loadOBJModelToCache(modelKey, 
                            `models/agv/${modelKey}.obj`,
                            `models/agv/${modelKey}.mtl`,
                            'agv'
                        );
                    } catch (error) {
                        console.warn(`无法加载OBJ模型 ${modelKey}，使用后备模型`);
                        modelCache[modelKey] = this.createFallbackAGVModel();
                    }
                }
                
                this.mesh = modelCache[modelKey].clone();
                
                // 不修改模型颜色，保持OBJ原始材质
                
                this.properties.speed = this.properties.speed || 1.0;
                this.properties.battery = this.properties.battery || 100;
                this.properties.status = this.properties.status || 'idle';
                this.properties.model = this.properties.model || 'X1-1000';
                this.properties.color = this.properties.color || '#7289da';
            }
            
            async createChargingModel() {
                if (!modelCache['charging_station']) {
                    try {
                        await loadOBJModelToCache('charging_station',
                            'models/charging/charging_station.obj',
                            'models/charging/charging_station.mtl',
                            'charging'
                        );
                    } catch (error) {
                        console.warn('无法加载充电桩OBJ模型，使用后备模型');
                        modelCache['charging_station'] = this.createFallbackChargingModel();
                    }
                }
                
                this.mesh = modelCache['charging_station'].clone();
                
                this.properties.power = this.properties.power || 7.5;
                this.properties.status = this.properties.status || 'available';
            }
            
            createPathModel() {
                const pathData = paths.find(p => `path-${p.id}` === this.id);
                if (pathData) {
                    this.mesh = createBeautifulPath(pathData);
                }
            }
            
            createFallbackAGVModel() {
                const group = new THREE.Group();
                
                const chassisGeometry = new THREE.BoxGeometry(2, 0.5, 3);
                const chassisMaterial = new THREE.MeshPhongMaterial({ 
                    color: 0x7289da,
                    shininess: 30
                });
                const chassis = new THREE.Mesh(chassisGeometry, chassisMaterial);
                chassis.position.y = 0.25;
                group.add(chassis);
                
                const bodyGeometry = new THREE.BoxGeometry(1.8, 0.8, 2.5);
                const bodyMaterial = new THREE.MeshPhongMaterial({ 
                    color: 0x5b6eae,
                    shininess: 20
                });
                const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
                body.position.y = 0.65;
                group.add(body);
                
                const sensorGeometry = new THREE.CylinderGeometry(0.3, 0.3, 0.3, 8);
                const sensorMaterial = new THREE.MeshPhongMaterial({ 
                    color: 0x333333
                });
                const sensor = new THREE.Mesh(sensorGeometry, sensorMaterial);
                sensor.position.y = 0.95;
                group.add(sensor);
                
                const wheelGeometry = new THREE.CylinderGeometry(0.2, 0.2, 0.3, 8);
                const wheelMaterial = new THREE.MeshPhongMaterial({ 
                    color: 0x222222
                });
                
                const wheelPositions = [
                    [-0.8, 0.15, -1.2], [0.8, 0.15, -1.2],
                    [-0.8, 0.15, 1.2], [0.8, 0.15, 1.2]
                ];
                
                wheelPositions.forEach((pos) => {
                    const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
                    wheel.position.set(pos[0], pos[1], pos[2]);
                    wheel.rotation.z = Math.PI / 2;
                    group.add(wheel);
                });
                
                return group;
            }
            
            createFallbackChargingModel() {
                const chargingGroup = new THREE.Group();
                
                const platformGeometry = new THREE.CylinderGeometry(1.5, 1.5, 0.2, 16);
                const platformMaterial = new THREE.MeshPhongMaterial({ 
                    color: 0xfaa61a
                });
                const platform = new THREE.Mesh(platformGeometry, platformMaterial);
                platform.position.y = 0.1;
                chargingGroup.add(platform);
                
                const poleGeometry = new THREE.CylinderGeometry(0.3, 0.3, 2, 8);
                const poleMaterial = new THREE.MeshPhongMaterial({ 
                    color: 0xfaa61a
                });
                const pole = new THREE.Mesh(poleGeometry, poleMaterial);
                pole.position.y = 1.1;
                chargingGroup.add(pole);
                
                const headGeometry = new THREE.SphereGeometry(0.4, 8, 8);
                const headMaterial = new THREE.MeshPhongMaterial({ 
                    color: 0x43b581,
                    emissive: 0x43b581,
                    emissiveIntensity: 0.5
                });
                const head = new THREE.Mesh(headGeometry, headMaterial);
                head.position.y = 2.2;
                chargingGroup.add(head);
                
                return chargingGroup;
            }
            
            createBasicMesh(elementType) {
                const color = new THREE.Color(elementType.color);
                
                switch(this.type) {
                    case 'shelf':
                        const group = new THREE.Group();
                        
                        const shelfGeometry = new THREE.BoxGeometry(4, 6, 2);
                        const shelfMaterial = new THREE.MeshPhongMaterial({ 
                            color: color,
                            shininess: 20
                        });
                        const shelf = new THREE.Mesh(shelfGeometry, shelfMaterial);
                        shelf.position.y = 3;
                        group.add(shelf);
                        
                        for (let i = 0; i < 4; i++) {
                            const layerGeometry = new THREE.BoxGeometry(3.8, 0.1, 1.8);
                            const layerMaterial = new THREE.MeshPhongMaterial({ 
                                color: 0x8a8f98
                            });
                            const layer = new THREE.Mesh(layerGeometry, layerMaterial);
                            layer.position.y = -2.5 + i * 1.5;
                            group.add(layer);
                        }
                        
                        this.mesh = group;
                        this.properties.capacity = this.properties.capacity || 100;
                        this.properties.occupancy = this.properties.occupancy || 0;
                        break;
                        
                    case 'obstacle':
                        const geometry = new THREE.ConeGeometry(1, 2, 8);
                        const material = new THREE.MeshPhongMaterial({ 
                            color: color,
                            transparent: true,
                            opacity: 0.8
                        });
                        this.mesh = new THREE.Mesh(geometry, material);
                        this.mesh.rotation.x = Math.PI;
                        this.mesh.position.y = 1;
                        break;
                        
                    case 'workstation':
                        const workstationGroup = new THREE.Group();
                        
                        const deskGeometry = new THREE.BoxGeometry(3, 0.2, 2);
                        const deskMaterial = new THREE.MeshPhongMaterial({ 
                            color: 0x8a8f98
                        });
                        const desk = new THREE.Mesh(deskGeometry, deskMaterial);
                        desk.position.y = 0.1;
                        workstationGroup.add(desk);
                        
                        const screenGeometry = new THREE.BoxGeometry(1.5, 1, 0.1);
                        const screenMaterial = new THREE.MeshPhongMaterial({ 
                            color: 0x1a1d21,
                            emissive: 0x7289da,
                            emissiveIntensity: 0.3
                        });
                        const screen = new THREE.Mesh(screenGeometry, screenMaterial);
                        screen.position.set(0, 0.7, 0.9);
                        workstationGroup.add(screen);
                        
                        this.mesh = workstationGroup;
                        this.properties.type = this.properties.type || 'packaging';
                        break;
                        
                    case 'zone':
                        const planeGeometry = new THREE.PlaneGeometry(10, 10);
                        const planeMaterial = new THREE.MeshPhongMaterial({ 
                            color: color,
                            transparent: true,
                            opacity: 0.3,
                            side: THREE.DoubleSide
                        });
                        this.mesh = new THREE.Mesh(planeGeometry, planeMaterial);
                        this.mesh.rotation.x = -Math.PI / 2;
                        break;
                        
                    case 'conveyor':
                        const conveyorGroup = new THREE.Group();
                        
                        const conveyorGeometry = new THREE.BoxGeometry(8, 0.3, 1);
                        const conveyorMaterial = new THREE.MeshPhongMaterial({ 
                            color: 0x40444b
                        });
                        const conveyor = new THREE.Mesh(conveyorGeometry, conveyorMaterial);
                        conveyor.position.y = 0.15;
                        conveyorGroup.add(conveyor);
                        
                        for (let i = 0; i < 8; i++) {
                            const rollerGeometry = new THREE.CylinderGeometry(0.2, 0.2, 1, 8);
                            const rollerMaterial = new THREE.MeshPhongMaterial({ 
                                color: 0x8a8f98
                            });
                            const roller = new THREE.Mesh(rollerGeometry, rollerMaterial);
                            roller.position.x = -3.5 + i;
                            roller.rotation.z = Math.PI / 2;
                            conveyorGroup.add(roller);
                        }
                        
                        this.mesh = conveyorGroup;
                        this.properties.speed = this.properties.speed || 0.5;
                        this.properties.direction = this.properties.direction || 'forward';
                        break;
                        
                    default:
                        const defaultGeometry = new THREE.BoxGeometry(1, 1, 1);
                        const defaultMaterial = new THREE.MeshPhongMaterial({ 
                            color: color 
                        });
                        this.mesh = new THREE.Mesh(defaultGeometry, defaultMaterial);
                        this.mesh.position.y = 0.5;
                }
            }
            
            createFallbackMesh() {
                if (this.type === 'agv') {
                    this.mesh = this.createFallbackAGVModel();
                } else if (this.type === 'charging') {
                    this.mesh = this.createFallbackChargingModel();
                } else {
                    this.createBasicMesh(ELEMENT_TYPES[this.type]);
                }
            }
            
            setupElement() {
                if (!this.mesh) return;
                
                this.mesh.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                
                this.updatePosition();
                
                this.createLabel();
                
                scene.add(this.mesh);
                
                this.mesh.userData.element = this;
            }
            
            createLabel() {
                if (!showLabels) return;
                
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = 200;
                canvas.height = 100;
                
                context.fillStyle = 'rgba(0, 0, 0, 0.8)';
                context.fillRect(0, 0, canvas.width, canvas.height);
                
                context.fillStyle = '#ffffff';
                context.font = 'bold 20px Arial';
                context.textAlign = 'center';
                context.textBaseline = 'middle';
                context.fillText(this.name, canvas.width / 2, canvas.height / 2);
                
                const texture = new THREE.CanvasTexture(canvas);
                const material = new THREE.SpriteMaterial({ map: texture });
                this.label = new THREE.Sprite(material);
                
                const labelY = this.getLabelHeight();
                this.label.position.y = labelY;
                this.label.scale.set(4, 2, 1);
                
                scene.add(this.label);
            }
            
            getLabelHeight() {
                const scale = MODEL_SCALES[this.type] || MODEL_SCALES.default;
                
                switch(this.type) {
                    case 'agv':
                        return (this.y + 2.0) * scale;
                    case 'charging':
                        return (this.y + 3.0) * scale;
                    case 'shelf':
                        return (this.y + 7.0) * scale;
                    case 'obstacle':
                        return (this.y + 3.0) * scale;
                    case 'path':
                        return (this.y + 3.0) * scale;
                    default:
                        return (this.y + 2.0) * scale;
                }
            }
            
            updateLabel() {
                if (this.label) {
                    scene.remove(this.label);
                    this.label = null;
                }
                this.createLabel();
            }
            
            updatePosition() {
                let actualY = this.y;
                
                switch(this.type) {
                    case 'agv':
                        actualY = this.y + 0.01;
                        break;
                    case 'charging':
                        actualY = this.y + 0.1;
                        break;
                    case 'shelf':
                        actualY = this.y + 3.0;
                        break;
                    case 'obstacle':
                        actualY = this.y + 1.0;
                        break;
                    case 'workstation':
                        actualY = this.y + 0.1;
                        break;
                    case 'conveyor':
                        actualY = this.y + 0.15;
                        break;
                    case 'path':
                        actualY = this.y + 0.5;
                        break;
                    default:
                        actualY = this.y;
                }
                
                const scale = MODEL_SCALES[this.type] || MODEL_SCALES.default;
                
                if (this.mesh) {
                    this.mesh.scale.set(scale, scale, scale);
                    this.mesh.position.set(this.x, actualY * scale, this.z);
                }
                
                if (this.label) {
                    const labelY = this.getLabelHeight() * scale;
                    this.label.position.set(this.x, labelY, this.z);
                }
            }
            
            // AGV路径移动
            updatePathMovement(deltaTime) {
                if (this.type !== 'agv' || !this.properties.pathId) return;
                
                const path = paths.find(p => p.id === this.properties.pathId);
                if (!path || !path.waypoints || path.waypoints.length < 2) return;
                
                let currentIndex = this.properties.currentWaypointIndex || 0;
                if (currentIndex >= path.waypoints.length - 1) {
                    this.properties.status = 'idle';
                    delete this.properties.currentWaypointIndex;
                    return;
                }
                
                this.properties.status = 'moving';
                
                const currentWP = path.waypoints[currentIndex];
                const targetWP = path.waypoints[currentIndex + 1];
                
                const currentX = (currentWP.x - 500) / 10;
                const currentZ = (currentWP.y - 100) / 10;
                const targetX = (targetWP.x - 500) / 10;
                const targetZ = (targetWP.y - 100) / 10;
                
                const progress = this.properties.pathProgress || 0;
                
                const distanceX = targetX - currentX;
                const distanceZ = targetZ - currentZ;
                const totalDistance = Math.sqrt(distanceX * distanceX + distanceZ * distanceZ);
                
                if (totalDistance === 0) {
                    this.properties.currentWaypointIndex = currentIndex + 1;
                    this.properties.pathProgress = 0;
                    return;
                }
                
                const speed = this.properties.speed || 1.0;
                const moveDistance = speed * deltaTime;
                
                let newProgress = progress + moveDistance / totalDistance;
                
                if (newProgress >= 1.0) {
                    this.x = targetX;
                    this.z = targetZ;
                    this.properties.currentWaypointIndex = currentIndex + 1;
                    this.properties.pathProgress = 0;
                    this.updatePosition();
                } else {
                    this.x = currentX + distanceX * newProgress;
                    this.z = currentZ + distanceZ * newProgress;
                    this.properties.pathProgress = newProgress;
                    this.updatePosition();
                    
                    if (this.mesh) {
                        const angle = Math.atan2(distanceZ, distanceX);
                        this.mesh.rotation.y = -angle + Math.PI / 2;
                    }
                }
                
                this.properties.battery = Math.max(0, (this.properties.battery || 100) - deltaTime * 0.5);
            }
            
            update(deltaTime) {
                if (isSimulationRunning) {
                    if (this.type === 'agv') {
                        this.updatePathMovement(deltaTime);
                    }
                }
            }
            
            getInfoHTML() {
                let actualY = this.y;
                switch(this.type) {
                    case 'agv': actualY += 0.75; break;
                    case 'charging': actualY += 1.1; break;
                    case 'shelf': actualY += 3.0; break;
                    case 'obstacle': actualY += 1.0; break;
                    case 'workstation': actualY += 0.1; break;
                    case 'conveyor': actualY += 0.15; break;
                    case 'path': actualY += 0.5; break;
                }
                
                let info = `
                    <div class="info-item">
                        <span class="info-label">名称:</span>
                        <span class="info-value">${this.name}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">类型:</span>
                        <span class="info-value">${ELEMENT_TYPES[this.type].name}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">位置(底):</span>
                        <span class="info-value">(${this.x.toFixed(1)}, ${this.y.toFixed(1)}, ${this.z.toFixed(1)})</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">位置(中):</span>
                        <span class="info-value">(${this.x.toFixed(1)}, ${actualY.toFixed(1)}, ${this.z.toFixed(1)})</span>
                    </div>
                `;
                
                for (const [key, value] of Object.entries(this.properties)) {
                    info += `
                        <div class="info-item">
                            <span class="info-label">${key}:</span>
                            <span class="info-value">${value}</span>
                        </div>
                    `;
                }
                
                return info;
            }
        }

        // ==================== 动画循环 ====================

        function animate(currentTime) {
            requestAnimationFrame(animate);
            
            const deltaTime = (currentTime - lastFrameTime) / 1000 || 0;
            lastFrameTime = currentTime;
            
            controls.update();
            
            if (isSimulationRunning) {
                sceneElements.forEach(element => element.update(deltaTime));
                
                if (checkPathCompletion() && Object.keys(activePaths).length > 0) {
                    console.log('所有路径已完成');
                    alert('所有AGV已到达目的地！');
                    stopAllPaths();
                }
                
                // 实时更新统计
                updateRealTimeStats();
            }
            
            // 更新路径动画
            updatePathAnimations(deltaTime);
            
            renderer.render(scene, camera);
        }

        // ==================== 路径系统函数 ====================

        function importPathFile() {
            document.getElementById('pathFileInput').click();
        }

        function handlePathFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            
            reader.onload = function(e) {
                try {
                    const pathData = JSON.parse(e.target.result);
                    loadPathData(pathData);
                } catch (error) {
                    alert('路径文件格式错误: ' + error.message);
                }
            };
            
            reader.readAsText(file);
        }

        function loadPathData(pathData) {
            showLoading('正在加载路径数据...');
            
            setTimeout(() => {
                try {
                    window.originalPathData = pathData;
                    
                    const pathElements = sceneElements.filter(el => el.type === 'path');
                    pathElements.forEach(el => {
                        removeElement(el.id);
                    });
                    
                    paths = [];
                    
                    if (pathData.agvs && pathData.agvs.length > 0) {
                        pathData.agvs.forEach(agvData => {
                            const existingAGV = sceneElements.find(el => 
                                el.type === 'agv' && el.id === agvData.id
                            );
                            
                            if (!existingAGV) {
                                const x = (150 - 500) / 10;
                                const z = (175 - 100) / 10;
                                
                                const agvElement = new SceneElement(
                                    agvData.id,
                                    'agv',
                                    agvData.name,
                                    x,
                                    0,
                                    z,
                                    {
                                        model: agvData.model || 'X1-1000',
                                        speed: agvData.speed || 1.0,
                                        battery: agvData.battery || 100,
                                        status: 'idle',
                                        color: agvData.color || '#7289da'
                                    }
                                );
                                
                                sceneElements.push(agvElement);
                            }
                        });
                    }
                    
                    if (pathData.paths && pathData.paths.length > 0) {
                        pathData.paths.forEach(path => {
                            paths.push({
                                id: path.id,
                                name: path.name,
                                agvId: path.agvId,
                                agvName: path.agvName,
                                agvColor: path.agvColor,
                                type: path.type,
                                description: path.description,
                                waypoints: path.waypoints || []
                            });
                            
                            const pathElement = new SceneElement(
                                `path-${path.id}`,
                                'path',
                                path.name,
                                0, 0, 0,
                                {
                                    agvId: path.agvId,
                                    agvName: path.agvName,
                                    agvColor: path.agvColor,
                                    waypoints: path.waypoints || [],
                                    type: 'visualization'
                                }
                            );
                            
                            sceneElements.push(pathElement);
                        });
                    }
                    
                    updateElementsList();
                    updateStatus();
                    
                    hideLoading();
                    
                    alert(`成功加载${pathData.paths?.length || 0}条路径数据！`);
                    
                } catch (error) {
                    console.error('加载路径数据失败:', error);
                    hideLoading();
                    alert('加载路径数据失败: ' + error.message);
                }
            }, 500);
        }

        function startAllPaths() {
            if (paths.length === 0) {
                alert('没有可用的路径数据，请先导入路径文件');
                return;
            }
            
            paths.forEach(path => {
                const agv = sceneElements.find(el => 
                    el.type === 'agv' && el.id === path.agvId
                );
                
                if (agv && path.waypoints && path.waypoints.length > 1) {
                    agv.properties.pathId = path.id;
                    agv.properties.currentWaypointIndex = 0;
                    agv.properties.pathProgress = 0;
                    agv.properties.status = 'moving';
                    
                    const startWP = path.waypoints[0];
                    agv.x = (startWP.x - 500) / 10;
                    agv.z = (startWP.y - 100) / 10;
                    agv.updatePosition();
                    
                    activePaths[path.id] = {
                        startTime: Date.now(),
                        status: 'running'
                    };
                }
            });
            
            toggleSimulation();
            
            console.log('开始路径仿真，共', Object.keys(activePaths).length, '条路径');
        }

        function stopAllPaths() {
            sceneElements.forEach(element => {
                if (element.type === 'agv') {
                    element.properties.status = 'idle';
                    delete element.properties.pathId;
                    delete element.properties.currentWaypointIndex;
                    delete element.properties.pathProgress;
                }
            });
            
            activePaths = {};
            
            if (isSimulationRunning) {
                toggleSimulation();
            }
            
            console.log('已停止所有路径仿真');
        }

        function startPath(agvId, pathId) {
            const agv = sceneElements.find(el => el.type === 'agv' && el.id === agvId);
            const path = paths.find(p => p.id === pathId);
            
            if (!agv || !path) {
                alert('找不到AGV或路径');
                return;
            }
            
            if (!path.waypoints || path.waypoints.length < 2) {
                alert('路径点数量不足');
                return;
            }
            
            stopAllPaths();
            
            agv.properties.pathId = path.id;
            agv.properties.currentWaypointIndex = 0;
            agv.properties.pathProgress = 0;
            agv.properties.status = 'moving';
            
            const startWP = path.waypoints[0];
            agv.x = (startWP.x - 500) / 10;
            agv.z = (startWP.y - 100) / 10;
            agv.updatePosition();
            
            activePaths[path.id] = {
                startTime: Date.now(),
                status: 'running'
            };
            
            if (!isSimulationRunning) {
                toggleSimulation();
            }
            
            console.log(`开始路径: ${path.name}, AGV: ${agv.name}`);
        }

        function stopPath(agvId) {
            const agv = sceneElements.find(el => el.type === 'agv' && el.id === agvId);
            if (agv && agv.properties.pathId) {
                agv.properties.status = 'idle';
                delete agv.properties.pathId;
                delete agv.properties.currentWaypointIndex;
                delete agv.properties.pathProgress;
                
                const pathId = agv.properties.pathId;
                if (pathId) {
                    delete activePaths[pathId];
                }
                
                console.log(`停止AGV ${agv.name} 的路径`);
            }
        }

        function checkPathCompletion() {
            let allCompleted = true;
            
            Object.keys(activePaths).forEach(pathId => {
                const agv = sceneElements.find(el => 
                    el.type === 'agv' && el.properties.pathId === pathId
                );
                
                if (agv) {
                    const path = paths.find(p => p.id === pathId);
                    if (path && path.waypoints) {
                        const currentIndex = agv.properties.currentWaypointIndex || 0;
                        if (currentIndex >= path.waypoints.length - 1 && 
                            agv.properties.status !== 'moving') {
                            activePaths[pathId].status = 'completed';
                            activePaths[pathId].endTime = Date.now();
                        } else {
                            allCompleted = false;
                        }
                    }
                }
            });
            
            return allCompleted;
        }

                    break;
                    
                case 'obstacle':
                    x = parseFloat(document.getElementById('defaultX')?.value) || 0;
                    y = 0;
                    z = parseFloat(document.getElementById('defaultZ')?.value) || 0;
                    properties = {
                        color: '#f04747'
                    };
                    break;
            }
            
            const id = `${type}-${Date.now()}`;
            
            const element = new SceneElement(id, type, name, x, y, z, properties);
            sceneElements.push(element);
            
            selectElement(element);
            
            saveToHistory('添加元素');
            
            updateElementsList();
            updateStatus();
            
            closeAddElementModal();
        }

        function removeElement(elementId) {
            const index = sceneElements.findIndex(e => e.id === elementId);
            if (index !== -1) {
                const element = sceneElements[index];
                
                scene.remove(element.mesh);
                if (element.label) scene.remove(element.label);
                
                if (element.type === 'path') {
                    paths = paths.filter(p => `path-${p.id}` !== elementId);
                }
                
                sceneElements.splice(index, 1);
                
                if (selectedElement && selectedElement.id === elementId) {
                    clearSelectedElement();
                }
                
                saveToHistory('删除元素');
                
                updateElementsList();
                updateStatus();
            }
        }

        function selectElement(element) {
            if (selectedElement) {
                selectedElement.mesh.traverse((child) => {
                    if (child.isMesh && child.material && child.material.emissive) {
                        child.material.emissive.setHex(0x000000);
                    }
                });
            }
            
            selectedElement = element;
            
            if (element.mesh) {
                element.mesh.traverse((child) => {
                    if (child.isMesh && child.material && child.material.emissive) {
                        child.material.emissive.setHex(0x333333);
                    }
                });
            }
            
            document.getElementById('propertiesPanel').style.display = 'block';
            
            updatePropertiesPanel();
            
            updateElementsList();
            
            showInfoPanel(element);
        }

        function clearSelectedElement() {
            if (selectedElement) {
                if (selectedElement.mesh) {
                    selectedElement.mesh.traverse((child) => {
                        if (child.isMesh && child.material && child.material.emissive) {
                            child.material.emissive.setHex(0x000000);
                        }
                    });
                }
                
                selectedElement = null;
                
                document.getElementById('propertiesPanel').style.display = 'none';
                
                closeInfoPanel();
                
                updateElementsList();
            }
        }

        function updateElementsList() {
            const container = document.getElementById('sceneElementsList');
            container.innerHTML = '';
            
            if (sceneElements.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="padding: 0.8rem;">
                        <i class="fas fa-object-group"></i>
                        <p style="font-size: 0.8rem;">暂无元素</p>
                    </div>
                `;
                return;
            }
            
            sceneElements.forEach(element => {
                const elementType = ELEMENT_TYPES[element.type];
                const isSelected = selectedElement && selectedElement.id === element.id;
                
                const item = document.createElement('div');
                item.className = `element-item ${isSelected ? 'selected' : ''}`;
                item.innerHTML = `
                    <div class="element-info">
                        <div class="element-icon ${element.type}" style="background-color: ${elementType.color}20; color: ${elementType.color};">
                            <i class="fas ${elementType.icon}"></i>
                        </div>
                        <div class="element-details">
                            <h4>${element.name}</h4>
                            <p>${elementType.name}</p>
                        </div>
                    </div>
                    <div class="element-actions">
                        <button class="element-action-btn" onclick="editElement('${element.id}')" title="编辑">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="element-action-btn" onclick="removeElement('${element.id}')" title="删除">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
                
                item.addEventListener('click', () => selectElement(element));
                container.appendChild(item);
            });
        }

            let actualY = selectedElement.y;
            switch(selectedElement.type) {
                case 'agv': actualY += 0.75; break;
                case 'charging': actualY += 1.1; break;
                case 'shelf': actualY += 3.0; break;
                case 'obstacle': actualY += 1.0; break;
                case 'workstation': actualY += 0.1; break;
                case 'conveyor': actualY += 0.15; break;
                case 'path': actualY += 0.5; break;
            }
            
            const basicGroup = document.createElement('div');
            basicGroup.className = 'property-group';
            basicGroup.innerHTML = `
                <div class="property-item">
                    <span class="property-label">位置 X:</span>
                    <input type="number" class="form-input" style="width: 70px; padding: 0.3rem; font-size: 0.8rem;" 
                           value="${selectedElement.x}" onchange="updateElementProperty('x', this.value)">
                </div>
                <div class="property-item">
                    <span class="property-label">位置 Y:</span>
                    <input type="number" class="form-input" style="width: 70px; padding: 0.3rem; font-size: 0.8rem;" 
                           value="${selectedElement.y}" onchange="updateElementProperty('y', this.value)">

                </div>
                <div class="property-item">
                    <span class="property-label">位置 Z:</span>
                    <input type="number" class="form-input" style="width: 70px; padding: 0.3rem; font-size: 0.8rem;" 
                           value="${selectedElement.z}" onchange="updateElementProperty('z', this.value)">
                </div>
            `;
            container.appendChild(basicGroup);
            
            for (const [key, value] of Object.entries(selectedElement.properties)) {
                const propertyGroup = document.createElement('div');
                propertyGroup.className = 'property-group';
                
                if (key === 'color') {
                    propertyGroup.innerHTML = `
                        <div class="property-item">

                            <input type="color" value="${value.startsWith('#') ? value : '#' + value}" 
                                   onchange="updateElementProperty('${key}', this.value.replace('#', ''))"

                    `;
                } else if (key === 'status') {
                    propertyGroup.innerHTML = `
                        <div class="property-item">
                            <span class="property-label">状态:</span>
                            <select class="form-select" style="width: 100px; padding: 0.3rem; font-size: 0.8rem;" 
                                    onchange="updateElementProperty('${key}', this.value)">
                                <option value="idle" ${value === 'idle' ? 'selected' : ''}>空闲</option>
                                <option value="moving" ${value === 'moving' ? 'selected' : ''}>移动</option>
                                <option value="charging" ${value === 'charging' ? 'selected' : ''}>充电</option>
                                <option value="error" ${value === 'error' ? 'selected' : ''}>故障</option>
                            </select>
                        </div>
                    `;
                } else if (typeof value === 'number') {
                    propertyGroup.innerHTML = `
                        <div class="property-item">
                            <span class="property-label">${key}:</span>
                            <input type="number" class="form-input" style="width: 70px; padding: 0.3rem; font-size: 0.8rem;" 
                                   value="${value}" onchange="updateElementProperty('${key}', this.value)">
                        </div>
                    `;
                } else {
                    propertyGroup.innerHTML = `
                        <div class="property-item">
                            <span class="property-label">${key}:</span>
                            <input type="text" class="form-input" style="width: 100px; padding: 0.3rem; font-size: 0.8rem;" 
                                   value="${value}" onchange="updateElementProperty('${key}', this.value)">
                        </div>

                container.appendChild(propertyGroup);
            }
            
            if (selectedElement.type === 'path') {
                const controlGroup = document.createElement('div');
                controlGroup.className = 'property-group';
                controlGroup.innerHTML = `
                    <div style="display: flex; gap: 0.4rem; margin-top: 0.6rem;">

                            <i class="fas fa-stop"></i> 停止

                container.appendChild(controlGroup);

        function updateElementProperty(property, value) {
            if (!selectedElement) return;
            
            if (['x', 'y', 'z'].includes(property)) {
                selectedElement[property] = parseFloat(value) || 0;
                selectedElement.updatePosition();
            } else if (property === 'color') {
                selectedElement.properties[property] = value;
                if (selectedElement.type === 'agv' || selectedElement.type === 'charging') {
                    selectedElement.createMeshAsync();
                }
            } else {
                selectedElement.properties[property] = isNaN(value) ? value : parseFloat(value);
            }
            
            updateElementsList();
            if (selectedElement) {
                showInfoPanel(selectedElement);
            }
        }

        function editElement(elementId) {
            const element = sceneElements.find(e => e.id === elementId);
            if (element) {
                const newName = prompt('请输入新的元素名称:', element.name);
                if (newName && newName.trim()) {
                    element.name = newName.trim();
                    element.updateLabel();
                    updateElementsList();
                    if (selectedElement && selectedElement.id === elementId) {
                        showInfoPanel(element);
                    }
                }
            }
        }

        // ==================== 视图控制函数 ====================

        function changeView(view) {
            currentView = view;
            
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            const viewBtn = document.querySelector(`.view-btn[onclick*="${view}"]`);
            if (viewBtn) {
                viewBtn.classList.add('active');
            }
            
            switch(view) {
                case 'top':
                    camera.position.set(0, 100, 0);
                    camera.lookAt(0, 0, 0);
                    camera.up.set(0, 0, -1);
                    break;
                    
                case 'front':
                    camera.position.set(0, 50, 100);
                    camera.lookAt(0, 0, 0);
                    camera.up.set(0, 1, 0);
                    break;
                    
                case 'side':
                    camera.position.set(100, 50, 0);
                    camera.lookAt(0, 0, 0);
                    camera.up.set(0, 1, 0);
                    break;
                    
                case 'perspective':
                    camera.position.set(50, 80, 50);
                    camera.lookAt(0, 0, 0);
                    camera.up.set(0, 1, 0);
                    break;
            }
            
            controls.update();
        }

        function zoomIn() {
            camera.position.multiplyScalar(0.9);
            controls.update();
        }

        function zoomOut() {
            camera.position.multiplyScalar(1.1);
            controls.update();
        }

        function resetView() {
            changeView('perspective');
        }

                sceneElements.forEach(element => element.updateLabel());

        function updateLighting() {
            const intensity = parseFloat(document.getElementById('lightIntensity').value);
            document.getElementById('lightIntensityValue').textContent = intensity.toFixed(1);
            
            scene.traverse((child) => {
                if (child.isLight) {
                    if (child.isAmbientLight) {
                        child.intensity = intensity * 0.6;
                    } else if (child.isDirectionalLight) {
                        child.intensity = intensity * 0.8;
                    } else if (child.isHemisphereLight) {
                        child.intensity = intensity * 0.4;
                    }
                }
            });
        }

            const size = parseInt(document.getElementById('gridSize').value);
            document.getElementById('gridSizeValue').textContent = size;
            setupGrid();

            switch(theme) {

                    scene.background = new THREE.Color(0x1a1d21);

                case 'modern':
                    scene.background = new THREE.Color(0x2c3e50);

        function initColorPicker(containerId, colors) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            container.innerHTML = '';
            
            colors.forEach(color => {
                const colorOption = document.createElement('div');
                colorOption.className = 'color-option';
                colorOption.style.backgroundColor = color;
                colorOption.title = color;
                colorOption.dataset.color = color;
                
                colorOption.addEventListener('click', () => {
                    document.querySelectorAll(`#${containerId} .color-option`).forEach(el => {
                        el.classList.remove('selected');
                    });
                    colorOption.classList.add('selected');
                });
                
                container.appendChild(colorOption);
            });
            
            if (container.firstChild) {
                container.firstChild.classList.add('selected');
            }

            const statusElement = document.getElementById('simulationStatus');
            
            if (isSimulationRunning) {
                simulationStartTime = Date.now();

                statusElement.style.color = '#43b581';

            } else {
                btn.innerHTML = '<i class="fas fa-play"></i> <span>仿真</span>';

        // ==================== 数据保存和加载函数 ====================

        function saveScene() {
            const sceneData = {
                name: document.getElementById('sceneName').textContent,
                elements: sceneElements.filter(el => el.type !== 'path').map(element => ({
                    id: element.id,
                    type: element.type,
                    name: element.name,
                    x: element.x,
                    y: element.y,
                    z: element.z,
                    properties: element.properties
                })),
                paths: paths,
                settings: {
                    showGridLines,
                    showPaths,
                    showLabels,
                    gridSize: parseInt(document.getElementById('gridSize').value),
                    lightIntensity: parseFloat(document.getElementById('lightIntensity').value),
                    theme: document.getElementById('sceneTheme').value
                },
                camera: {
                    position: camera.position.toArray(),
                    rotation: camera.rotation.toArray(),
                    zoom: camera.zoom
                },
                savedAt: new Date().toISOString(),
                version: '1.2'
            };
            
            const scenes = JSON.parse(localStorage.getItem('agvScenes') || '[]');
            scenes.push(sceneData);
            localStorage.setItem('agvScenes', JSON.stringify(scenes));
            
            localStorage.setItem('currentScene', JSON.stringify(sceneData));
            
            alert(`场景 "${sceneData.name}" 保存成功！`);
        }

        function loadSceneFromFile() {
            const fileInput = document.getElementById('sceneFileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('请先选择场景文件');
                return;
            }
            
            const reader = new FileReader();
            
            reader.onload = function(e) {
                try {
                    const sceneData = JSON.parse(e.target.result);
                    loadSceneData(sceneData);
                    closeLoadSceneModal();
                } catch (error) {
                    alert('场景文件格式错误: ' + error.message);
                }
            };
            
            reader.readAsText(file);
        }

        function updateSavedScenesList() {
            const container = document.getElementById('savedScenesList');
            const scenes = JSON.parse(localStorage.getItem('agvScenes') || '[]');
            
            container.innerHTML = '';
            
            if (scenes.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 0.8rem; color: #8a8f98; font-size: 0.8rem;">暂无保存的场景</div>';
                return;
            }
            
            scenes.forEach((scene, index) => {
                const sceneItem = document.createElement('div');
                sceneItem.className = 'element-item';
                sceneItem.style.cursor = 'pointer';
                sceneItem.innerHTML = `
                    <div class="element-info">
                        <div class="element-icon zone" style="background-color: rgba(89, 54, 149, 0.2); color: #593695;">
                            <i class="fas fa-map"></i>
                        </div>
                        <div class="element-details">
                            <h4>${scene.name}</h4>
                            <p>${scene.elements?.length || 0} 个元素</p>
                        </div>
                    </div>
                `;
                
                sceneItem.addEventListener('click', () => {
                    loadSceneData(scene);
                    closeLoadSceneModal();
                });
                
                container.appendChild(sceneItem);
            });
        }

        function loadSceneData(sceneData) {
            resetScene(true);
            
            document.getElementById('sceneName').textContent = sceneData.name;
            
            showLoading('正在加载场景...');
            
            setTimeout(() => {
                try {
                    if (sceneData.elements) {
                        for (const elementData of sceneData.elements) {
                            const element = new SceneElement(
                                elementData.id,
                                elementData.type,
                                elementData.name,
                                elementData.x,
                                elementData.y,
                                elementData.z,
                                elementData.properties
                            );
                            sceneElements.push(element);
                        }
                    }
                    
                    if (sceneData.paths) {
                        paths = sceneData.paths;
                        
                        sceneData.paths.forEach(path => {
                            if (path.waypoints && path.waypoints.length > 1) {
                                const pathElement = new SceneElement(
                                    `path-${path.id}`,
                                    'path',
                                    path.name,
                                    0, 0, 0,
                                    {
                                        agvId: path.agvId,
                                        agvName: path.agvName,
                                        agvColor: path.agvColor,
                                        waypoints: path.waypoints || [],
                                        type: 'visualization'
                                    }
                                );
                                
                                sceneElements.push(pathElement);
                            }
                        });
                    }
                    
                    if (sceneData.settings) {
                        showGridLines = sceneData.settings.showGridLines || true;
                        showPaths = sceneData.settings.showPaths || true;
                        showLabels = sceneData.settings.showLabels || true;
                        
                        document.getElementById('gridSize').value = sceneData.settings.gridSize || 10;
                        document.getElementById('lightIntensity').value = sceneData.settings.lightIntensity || 0.8;
                        document.getElementById('sceneTheme').value = sceneData.settings.theme || 'industrial';
                        
                        updateGrid();
                        updateLighting();
                        changeSceneTheme();
                    }
                    
                    if (sceneData.camera) {
                        camera.position.fromArray(sceneData.camera.position);
                        camera.rotation.fromArray(sceneData.camera.rotation);
                        if (sceneData.camera.zoom) camera.zoom = sceneData.camera.zoom;
                        camera.updateProjectionMatrix();
                        controls.update();
                    }
                    
                    updateElementsList();
                    updateStatus();
                    
                    hideLoading();
                    alert(`场景 "${sceneData.name}" 加载成功！`);
                    
                } catch (error) {
                    console.error('加载场景失败:', error);
                    hideLoading();
                    alert('加载场景失败: ' + error.message);
                }
            }, 100);
        }

        function exportScene() {
            const sceneData = {
                name: document.getElementById('sceneName').textContent,
                elements: sceneElements.filter(el => el.type !== 'path').map(element => ({
                    id: element.id,
                    type: element.type,
                    name: element.name,
                    x: element.x,
                    y: element.y,
                    z: element.z,
                    properties: element.properties
                })),
                paths: paths,
                settings: {
                    showGridLines,
                    showPaths,
                    showLabels,
                    gridSize: parseInt(document.getElementById('gridSize').value),
                    lightIntensity: parseFloat(document.getElementById('lightIntensity').value),
                    theme: document.getElementById('sceneTheme').value
                },
                exportedAt: new Date().toISOString(),
                version: '1.2'
            };
            
            const dataStr = JSON.stringify(sceneData, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            
            const exportFileName = `agv-scene-${sceneData.name.replace(/\s+/g, '-').toLowerCase()}-${new Date().toISOString().slice(0,10)}.json`;
            
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileName);
            linkElement.click();
            
            alert(`场景 "${sceneData.name}" 已导出`);
        }

        function resetScene(keepDefault = false) {
            if (!keepDefault) {
                if (!confirm('确定要重置场景吗？这将清除所有元素和设置。此操作不可撤销！')) {
                    return;
                }
            }
            
            sceneElements.forEach(element => {
                scene.remove(element.mesh);
                if (element.label) scene.remove(element.label);
            });
            
            sceneElements = [];
            selectedElement = null;
            paths = [];
            activePaths = {};
            isSimulationRunning = false;
            
            clearSelectedElement();
            updateElementsList();
            
            document.getElementById('sceneName').textContent = '默认场景';
            document.getElementById('gridSize').value = 10;
            document.getElementById('lightIntensity').value = 0.8;
            document.getElementById('sceneTheme').value = 'industrial';
            
            changeView('perspective');
            
            updateGrid();
            updateLighting();
            changeSceneTheme();
            
            document.getElementById('simulationBtn').innerHTML = '<i class="fas fa-play"></i> <span>仿真</span>';
            document.getElementById('simulationStatus').textContent = '停止';
            document.getElementById('simulationStatus').style.color = '#8a8f98';
            
            if (!keepDefault) {
                addExampleElements();
            }
            
            localStorage.removeItem('currentScene');
            
            if (!keepDefault) {
                alert('场景已重置');
            }
        }

        // ==================== 截图功能 ====================

        function captureScreenshot() {
            const canvas = document.getElementById('sceneCanvas');
            const link = document.createElement('a');
            
            renderer.setPixelRatio(2);
            renderer.render(scene, camera);
            
            link.href = canvas.toDataURL('image/png');
            link.download = `agv-scene-${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.png`;
            link.click();
            
            renderer.setPixelRatio(window.devicePixelRatio);
            
            alert('场景截图已保存');
        }

        // ==================== 工具函数 ====================

        function showLoading(text) {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        function saveToHistory(action) {
            console.log(`历史记录: ${action}`);
        }

        function updateStatus() {
            const agvCount = sceneElements.filter(e => e.type === 'agv').length;
            const pathCount = paths.length;
            
            document.getElementById('elementCount').textContent = sceneElements.length;
            document.getElementById('agvCount').textContent = agvCount;
            document.getElementById('pathCount').textContent = pathCount;
            
            updatePathList();
        }
    </script>
